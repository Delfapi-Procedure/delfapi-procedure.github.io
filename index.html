<script type="application/json" id="dati">{"logo": "marchio.png", "aree": [{"id": "sicurezza", "nome": "Sicurezza", "desc": "Regole valide in tutto il cantiere.", "stile": "rossa", "icona": "casco"}, {"id": "forno", "nome": "Forno", "desc": "Campata forno elettrico.", "stile": "", "icona": "fiamma"}, {"id": "cco1", "nome": "CCO1", "desc": "Colata continua e pozzo rottami.", "stile": "", "icona": "colata"}, {"id": "ncb", "nome": "NCB", "desc": "Capannone NCB: banchi, officina, stoccaggio.", "stile": "", "icona": "capannone"}, {"id": "rottame", "nome": "Parco Rottame", "desc": "Cesoia Vezzani e area Gate 207.", "stile": "gialla", "icona": "cesoia"}, {"id": "movimenti", "nome": "Movimentazione", "desc": "Sollevamento, imbracature, consegne ai reparti.", "stile": "verde", "icona": "gancio"}, {"id": "nuovi", "nome": "Nuovi assunti", "desc": "Primo giorno in cantiere e come arrivare in sede.", "stile": "nera", "icona": "nuovi"}], "procedure": [{"id": "p09", "area": "rottame", "titolo": "Sostituzione lame cesoia Vezzani", "codice": "ADR-TD-PRM-106", "rev": "00", "note": "Parco Rottame, Gate 207. DPI obbligatori, messa in sicurezza (Tenaris) e ingresso, rimozione lame, pulizia sedi, nuove lame inferiori, lame superiori con martinetto.", "video": "cambio-lame-cesoia-vezzani.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "p13", "area": "nuovi", "titolo": "Primo giorno in cantiere", "codice": "", "rev": "", "note": "Portineria, tornelli, furgone, spogliatoi e arrivo in NCB.", "video": "primo-giorno-cantiere.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "p14", "area": "nuovi", "titolo": "Come raggiungere la sede Delfapi", "codice": "", "rev": "", "note": "Via San Rocco 12, Solto Collina (BG), tel. 035 980143. Navigatore, riconoscere la sede, dove parcheggiare (auto e camion), cosa fare all'arrivo.", "video": "come-arrivare-sede-delfapi.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "p15", "area": "ncb", "titolo": "NCB – Analisi dei rischi", "codice": "", "rev": "", "note": "Ingresso e DPI, corsia di transito, carichi sospesi, saldatura e taglio, seghetto/trapano/pressa, scaffalatura, ordine e pulizia, buca siviere, depositi esterni.", "video": "ncb-analisi-rischi.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "p16", "area": "cco1", "titolo": "Sostituzione pompa fossa scaglie CCO1", "codice": "", "rev": "2", "note": "Analisi dei rischi: posizionamento con muletto, scollegamento tubazioni, smontaggio bulloni, imbraco (sollevamento con carroponte Dalmine), montaggio e collegamento.", "video": "sostituzione-pompa-fossa-scaglie-cco1.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "p17", "area": "movimenti", "titolo": "Controllo delle brache prima dell'uso", "codice": "", "rev": "", "note": "Guarda e tocca tutta la braca: tessuto, cuciture, calore, prodotti chimici, asole e accessori. Un solo difetto: non usarla, contenitore rosso FUORI USO e avvisa il preposto. Paraspigoli durante il sollevamento.", "video": "controllo-brache.mp4", "pdf": "", "aggiunto": "2026-11-01"}, {"id": "e01", "area": "emergenza", "titolo": "Infortunio", "testo": true, "codice": "", "rev": "", "video": "", "pdf": "", "note": "1. Metti in sicurezza te stesso. Non spostare l'infortunato, a meno che sia in pericolo immediato.\n2. Chiama il 035 560 3444 e di': cosa è successo, dove sei (numero del gate), quante persone coinvolte.\n3. Manda un collega al gate ad aspettare i soccorsi e guidarli.\n4. Avvisa il preposto Delfapi."}, {"id": "e02", "area": "emergenza", "titolo": "Principio d'incendio", "testo": true, "codice": "", "rev": "", "video": "", "pdf": "", "note": "1. Chiama il 035 560 3555 e comunica il numero del gate.\n2. Se il fuoco è piccolo e sai usare l'estintore, intervieni restando tra il fuoco e la via di fuga. Altrimenti allontanati.\n3. Se puoi farlo senza rischio, chiudi le bombole e allontana cannello e saldatrice.\n4. Avvisa il preposto Delfapi."}, {"id": "e03", "area": "emergenza", "titolo": "Sversamento", "testo": true, "codice": "", "rev": "", "video": "", "pdf": "", "note": "1. Ferma la fonte se è sicuro farlo (rubinetto, valvola, fusto).\n2. Non far arrivare il liquido ai tombini: usa sabbia o il materiale assorbente del cantiere.\n3. Avvisa il preposto Delfapi e il referente Tenaris, che decide se chiamare il 035 560 3555.\n4. Non riprendere il lavoro finché l'area non è pulita e autorizzata."}, {"id": "e04", "area": "emergenza", "titolo": "Allarme di stabilimento", "testo": true, "codice": "", "rev": "", "video": "", "pdf": "", "immagine": "", "note": "1. Interrompi il lavoro in sicurezza: spegni cannello e saldatrice, scendi dalla quota se puoi, lascia l'attrezzatura.\n2. Raggiungi il punto di raccolta più vicino tra quelli segnati sulla planimetria (simbolo verde con le quattro frecce), percorrendo le strade esterne. Non entrare nei reparti.\n3. Aspetta il preposto, che fa la conta. Non usare l'auto.\n4. Non tornare indietro finché non viene dichiarato il cessato allarme."}], "gate": [{"zona": "NCB e Parco Rottame", "voci": [{"n": "202", "dove": "NCB, ingresso"}, {"n": "211", "dove": "NCB, lato magazzino"}, {"n": "209", "dove": "Parco Rottame, nord"}, {"n": "207", "dove": "Parco Rottame, est"}, {"n": "208", "dove": "Buca scorie, Area 5"}, {"n": "201", "dove": "Parco Barre"}]}, {"zona": "Forno e colata", "voci": [{"n": "203", "dove": "Forno, lato officina"}, {"n": "204", "dove": "CCO2"}, {"n": "205", "dove": "Rifacimento forno"}, {"n": "206", "dove": "Forno, lato MUA"}]}, {"zona": "Servizi", "voci": [{"n": "305", "dove": "Mensa, Area 3"}, {"n": "306", "dove": "Area imprese"}]}], "planimetria": "", "sezioni": {"regole": {"titolo": "Regole e DPI", "desc": "Le dieci regole che valgono sempre e, per ogni lavorazione, l'elenco completo di cosa indossare. Ricavate dalle analisi dei rischi Delfapi.", "pronto": true, "regole": ["Prima di accedere a un impianto Tenaris e di intervenire: procedura di accesso, MIS e LOTO. Si inizia solo dopo la conferma di messa in sicurezza da parte di Tenaris.", "Mai sotto il carico sospeso, mai nel raggio di rotazione. Il sollevamento di prova a pochi centimetri è obbligatorio.", "Brache, funi, grilli, golfari: portata (WLL) leggibile e rispettata, tenendo conto dell'angolo. Marcatura illeggibile o difetto = fuori uso.", "Tubi, rulli e barre rotolano: sempre cunei o traverse, sui carrelloni, sui cavalletti e sugli scaffali.", "Lavori a caldo (saldatura, molatura, ossitaglio) solo con permesso a caldo ed estintore a portata di mano. Mai vicino ai depositi di bombole, vernici e gasolio.", "Mai saldare o intervenire su un circuito in pressione o su un compressore collegato: prima scaricare e verificare lo zero.", "Occhiali sempre con utensili a percussione, mole, aghi e aria compressa. L'aria compressa non si punta mai su una persona né sui vestiti.", "Attrezzatura integra o fuori servizio: mole incrinate, utensili a percussione con testa deformata o sbavata, funi con fili rotti, scale su fondo instabile non si usano.", "In quota: imbracatura agganciata a un ancoraggio idoneo, tre punti d'appoggio sulla scala, retrattile da revisionare dopo ogni caduta.", "Quadri elettrici e impianto fisso gas: Delfapi non fa manutenzione. Anomalia = chiudere, scollegare e segnalare."], "dpi_base": "Dotazione base, sempre in tutto il cantiere: casco di protezione, occhiali EN 166, guanti di protezione meccanica EN 388, indumenti ad alta visibilità e aderenti, scarpe di sicurezza S3 antiscivolo. Ogni scheda qui sotto ripete l'elenco completo per la lavorazione: in grassetto cosa è specifico.", "dpi": [{"lav": "Saldatura MMA / TIG / MIG, taglio al plasma, scriccatura", "cosa": [{"t": "Casco di protezione"}, {"t": "Maschera da saldatura DIN 9–13 (EN 379), sopra gli occhiali EN 166", "s": true}, {"t": "Facciale filtrante FFP3; scriccatura: P3 a carboni attivi", "s": true}, {"t": "Otoprotettori EN 352", "s": true}, {"t": "Guanti da saldatore in crosta", "s": true}, {"t": "Giacca e pantaloni ignifughi", "s": true}, {"t": "Scarpe di sicurezza S3"}]}, {" i EN 388"}, {"t": "Indumenti ad alta visibilità classe 2 / 3", "s": true}, {"t": "Scarpe di sicurezza S3"}, {"t": "Cintura di sicurezza allacciata alla guida", "s": true}]}, {"lav": "Macchine da officina: trapano a colonna, segatrice, filettatrice, pressa, piegatubi", "cosa": [{"t": "Casco di protezione"}, {"t": "Visiera o occhiali a mascherina EN 166", "s": true}, {"t": "Otoprotettori per segatrice e pressa", "s": true}, {"t": "Guanti EN 388 (mai vicino a organi in rotazione)"}, {"t": "Indumenti aderenti, senza parti svolazzanti", "s": true}, {"t": "Scarpe di sicurezza S3"}]}, {"lav": "Deposito bombole e carrello porta bombole", "cosa": [{"t": "Casco di protezione"}, {"t": "Occhiali EN 166"}, {"t": "Guanti EN 388, puliti da oli e grassi"}, {"t": "Indumenti ad alta visibilità"}, {"t": "Scarpe di sicurezza S3"}]}, {"lav": "Deposito vernici, diluenti e catalizzatori", "cosa": [{"t": "Casco di protezione"}, {"t": "Occhiali a mascherina o visiera EN 166", "s": true}, {"t": "Facciale con filtri per vapori organici A2 / A2P3", "s": true}, {"t": "Guanti resistenti ai prodotti chimici EN ISO 374", "s": true}, {"t": "Indumenti da lavoro antistatici", "s": true}, {"t": "Scarpe di sicurezza S3"}]}, {"lav": "Deposito gasolio e rifornimento mezzi", "cosa": [{"t": "Casco di protezione"}, {"t": "Occhiali a mascherina o visiera EN 166", "s": true}, {"t": "Guanti resistenti agli idrocarburi EN ISO 374", "s": true}, {"t": "Indumenti ad alta visibilità, integri"}, {"t": "Scarpe di sicurezza S3"}]}, {"lav": "Sabbiatura a bicarbonato e lavaggio ad alta pressione", "cosa": [{"t": "Casco di protezione"}, {"t": "Visiera integrale più occhiali a mascherina EN 166 / EN 170", "s": true}, {"t": "Facciale filtrante FFP2 / FFP3", "s": true}, {"t": "Otoprotettori EN 352", "s": true}, {"t": "Guanti impermeabili in nitrile EN 388 / EN ISO 374", "s": true}, {"t": "Tuta impermeabile con cappuccio", "s": true}, {"t": "Stivali di sicurezza S5", "s": true}]}, {"lav": "Aria compressa: soffiaggio, compressore, utensili pneumatici", "cosa": [{"t": "Casco di protezione"}, {"t": "Occhiali EN 166 sempre indossati durante il soffiaggio", "s": true}, {"t": "Otoprotettori EN 352", "s": true}, {"t": "Guanti EN 388"}, {"t": "Indumenti ad alta visibilità"}, {"t": "Scarpe di sicurezza S3"}]}, {"lav": "Carico e scarico camion, traino carrelli, movimentazione a mano", "cosa": [{"t": "Casco di protezione con sottogola", "s": true}, {"t": "Occhiali EN 166"}, {"t": "Guanti anti-taglio EN 388", "s": true}, {"t": "Indumenti ad alta visibilità classe 2 / 3", "s": true}, {"t": "Scarpe di sicurezza S3"}]}], "dpi_nota": "Fa fede l'analisi dei rischi della singola attività."}, "contatti": {"titolo": "Contatti", "desc": "Contatti aziendali Delfapi e segnalazione di problemi.", "pronto": false}}, "galleria": ["https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-01.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-02.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-03.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-04.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-05.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-06.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-07.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-08.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-09.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-10.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-11.jpg", "https://www.delfapi.it/wp-content/uploads/2025/09/Delfapi-lavorazioni-impianti-industriali-1 /* ============ SCHEDE PROCEDURA ============ */
function cardProc(p){
  var ha = !!p.video, haPdf = !!p.pdf, testo = !!p.testo;
  var meta = [];
  if(p.codice) meta.push("<b>"+esc(p.codice)+"</b>");
  if(p.rev) meta.push("Rev. "+esc(p.rev));
  if(!testo) meta.push(ha ? '<span class="badge ok">Video</span>' : (haPdf ? '<span class="badge ok">Documento</span>' : '<span class="badge">In preparazione</span>'));
  var corpo = "";
  if(ha) corpo += '<div class="video"><video controls controlsList="nodownload" playsinline muted preload="metadata" src="'+esc(p.video)+'"></video></div>';
  else if(!haPdf && !testo) corpo += '<div class="attesa">Il video di questa procedura sarà caricato a breve.</div>';
  if(p.note) corpo += "<p>"+esc(p.note)+"</p>";
  if(p.immagine) corpo += '<a class="figura" href="'+esc(p.immagine)+'" target="_blank" rel="noopener"><img src="'+esc(p.immagine)+'" alt="" loading="lazy"><span>Tocca per ingrandire la planimetria</span></a>';
  var az = "";
  if(haPdf) az += '<a class="btn secondario" href="'+esc(p.pdf)+'" target="_blank" rel="noopener">Apri il documento</a>';
  if(az) corpo += '<div class="azioni">'+az+'</div>';
  return '<article class="proc" data-id="'+esc(p.id)+'">'+
    '<button class="proc-testa" aria-expanded="false">'+
      '<span class="ico'+((ha||haPdf||testo)?"":" manca")+(testo?" rosso":"")+'">'+(ha?ICO_VIDEO:(testo?ICO_ALERT:ICO_DOC))+'</span>'+
      '<span><h3>'+esc(p.titolo)+'</h3><div class="meta">'+meta.join(" · ")+'</div></span>'+CHEV+
    '</button><div class="proc-corpo">'+corpo+'</div></article>';
}
function attivaCard(cont){
  cont.querySelectorAll(".proc-testa").forEach(function(b){
    b.addEventListener("click",function(){
      var art=b.parentElement, apri=!art.classList.contains("aperta");
      art.classList.toggle("aperta",apri); b.setAttribute("aria-expanded",apri?"true":"false");
      if(!apri){var v=art.querySelector("video"); if(v) v.pause();}
    });
  });
}

function dataIt(iso){ if(!iso) return ""; var p=String(iso).split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso; }
function dataIso(t){ t=String(t||"").trim(); var m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m){ var y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2); } return t.slice(0,10); }
function csvRighe(t){ var r=[],row=[],cur="",q=false; for(var i=0;i<t.length;i++){ var c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else if(c==='"') q=true; else if(c===","){row.push(cur);cur="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cur); r.push(row); row=[]; cur=""; } else cur+=c; } if(cur!==""||row.length){row.push(cur);r.push(row);} return r; }
function avvisiDaCsv(t){
  var righe=csvRighe(t).filter(function(r){return r.join("").trim()}); if(righe.length<2) return [];
  var h=righe[0].map(function(x){return norm(x).trim()}); function col(n){ return h.findIndex(function(x){return x.indexOf(n)===0}); }
  var iD=col("data"),iC=col("categ"),iT=col("titolo"),iX=col("testo"),iS=col("scad");
  return righe.slice(1).map(function(r){ return {data:dataIso(r[iD]),categoria:(r[iC]||"Informazioni").trim(),titolo:(r[iT]||"").trim(),testo:(r[iX]||"").trim(),scadenza:dataIso(r[iS]||"")}; }).filter(function(a){return a.titolo});
}
function disegnaUfficio(lista){
  var el=$("#lista-ufficio"); if(!el) return;

  var l=(lista||[]).filter(function(a){ return !a.scadenza || a.scadenza>=oggiIso; }).sort(function(a,b){return a.data<b.data?1:-1});
  if(!l.length){ el.innerHTML='<div class="in-prep" style="grid-column:1/-1">Nessun avviso questa settimana.</div>'; return; }
  var sette=new Date(oggi.getTime()-7*86400000).toISOString().slice(0,10);
  el.innerHTML=l.map(function(a){ var cat=(a.categoria||"Informazioni"); var cls=cat.split(" ")[0].replace(/[^A-Za-z]/g,"");
    return '<article class="avv '+esc(cls)+'"><span class="quando">'+esc(dataIt(a.data))+'</span><span class="cat'+(a.data>=sette?" nuovo":"")+'">'+esc(cat)+'</span><h3>'+esc(a.titolo)+'</h3><p>'+esc(a.testo)+'</p>'+(a.scadenza?'<div class="scad">entro il <b>'+esc(dataIt(a.scadenza))+'</b></div>':'')+'</article>'; }).join("");
  var ult=l[0].data; var dsc=$("#ufficio-desc"); if(dsc&&ult) dsc.textContent="Avvisi della settimana: corsi, visite mediche, comunicazioni. Ultimo aggiornamento "+dataIt(ult)+".";
  AVVISI=l; IDX=null;
}

ri la planimetria completa": "Otvori cijeli plan", "Cosa faccio se…": "Šta da radim ako…", "1. Metti in sicurezza te stesso. Non spostare l'infortunato, a meno che sia in pericolo immediato.\n2. Chiama il 035 560 3444 e di': cosa è successo, dove sei (numero del gate), quante persone coinvolte.\n3. Manda un collega al gate ad aspettare i soccorsi e guidarli.\n4. Avvisa il preposto Delfapi.": "1. Prvo osiguraj sebe. Ne pomjeraj povrijeđenog, osim ako je u neposrednoj opasnosti.\n2. Zovi 035 560 3444 i reci: šta se desilo, gdje si (broj gate-a), koliko je osoba povrijeđeno.\n3. Pošalji kolegu na gate da sačeka hitnu pomoć i dovede je.\n4. Obavijesti nadređenog (preposto) Delfapi.", "Principio d'incendio": "Početak požara", "1. Chiama il 035 560 3555 e comunica il numero del gate.\n2. Se il fuoco è piccolo e sai usare l'estintore, intervieni restando tra il fuoco e la via di fuga. Altrimenti allontanati.\n3. Se puoi farlo senza rischio, chiudi le bombole e allontana cannello e saldatrice.\n4. Avvisa il preposto Delfapi.": "1. Zovi 035 560 3555 i reci broj gate-a.\n2. Ako je vatra mala i znaš koristiti aparat za gašenje, interveniši stojeći između vatre i izlaza. U suprotnom se udalji.\n3. Ako možeš bez rizika, zatvori boce i skloni plamenik i aparat za varenje.\n4. Obavijesti nadređenog (preposto) Delfapi.", "Sversamento": "Izlijevanje tečnosti", "1. Ferma la fonte se è sicuro farlo (rubinetto, valvola, fusto).\n2. Non far arrivare il liquido ai tombini: usa sabbia o il materiale assorbente del cantiere.\n3. Avvisa il preposto Delfapi e il referente Tenaris, che decide se chiamare il 035 560 3555.\n4. Non riprendere il lavoro finché l'area non è pulita e autorizzata.": "1. Zaustavi izvor ako je sigurno (slavina, ventil, bure).\n2. Ne dozvoli da tečnost dođe do šahtova: koristi pijesak ili upijajući materijal gradilišta.\n3. Obavijesti nadređenog Delfapi i odgovornu osobu Tenaris, koja odlučuje da li zvati 035 560 3555.\n4. Ne nastavljaj rad dok prostor nije očišćen i odobren.", "Allarme di stabilimento": "Uzbuna u fabrici", "1. Interrompi il lavoro in sicurezza: spegni cannello e saldatrice, scendi dalla quota se puoi, lascia l'attrezzatura.\n2. Raggiungi il punto di raccolta più vicino tra quelli segnati sulla planimetria (simbolo verde con le quattro frecce), percorrendo le strade esterne. Non entrare nei reparti.\n3. Aspetta il preposto, che fa la conta. Non usare l'auto.\n4. Non tornare indietro finché non viene dichiarato il cessato allarme.": "1. Prekini rad na siguran način: ugasi plamenik i aparat za varenje, siđi sa visine ako možeš, ostavi alat.\n2. Idi do najbližeg zbornog mjesta označenog na planu (zeleni znak sa četiri strelice), vanjskim putevima. Ne ulazi u pogone.\n3. Sačekaj nadređenog, koji broji ljude. Ne koristi auto.\n4. Ne vraćaj se dok se ne objavi kraj uzbune.", "Tocca per ingrandire la planimetria": "Dodirni da povećaš plan", "Procedure": "Procedure", "Scegli la tua area e guarda il video": "Izaberi svoju zonu i pogledaj video", "prima": "prije", "di iniziare il lavoro. Se qualcosa non ti è chiaro, chiedi al preposto.": "nego što počneš raditi. Ako ti nešto nije jasno, pitaj nadređenog.", "Sicurezza": "Sigurnost", "Movimentazione": "Rukovanje i dizanje", "Nuovi assunti": "Novi radnici", "Regole e DPI": "Pravila i LZO", "Le dieci regole che valgono sempre e, per ogni lavorazione, l'elenco completo di cosa indossare. Ricavate dalle analisi dei rischi Delfapi.": "Deset pravila koja uvijek važe i, za svaki posao, potpun spisak opreme koju treba nositi. Preuzeto iz analiza rizika Delfapi.", "Le dieci regole d’oro": "Deset zlatnih pravila", "Prima di accedere a un impianto Tenaris e di intervenire: procedura di accesso, MIS e LOTO. Si inizia solo dopo la conferma di messa in sicurezza da parte di Tenaris.": "Prije ulaska u postrojenje Tenaris i intervencije: procedura pristupa, MIS i LOTO. Počinje se tek nakon što Tenaris potvrdi da je postrojenje osigurano.", "Mai sotto il carico sospeso, mai nel raggio di rotazione. Il sollevamento di prova a pochi centimetri è obbligatorio.": "Nikad ispod visećeg tereta, nikad u radijusu okretanja. Probno podizanje na nekoliko centimetara je obavezno.", "Brache, funi, grilli, golfari: portata (WLL) leggibile e rispettata, tenendo conto dell'angolo. Marcatura illeggibile o difetto = fuori uso.": "Trake, sajle, škopci, ušice: nosivost (WLL) čitljiva i poštovana, uzimajući u obzir ugao. Nečitljiva oznaka ili oštećenje = van upotrebe.", "Tubi, rulli e barre rotolano: sempre cunei o traverse, sui carrelloni, sui cavalletti e sugli scaffali.": "Cijevi, valjci i šipke se kotrljaju: uvijek klinovi ili podmetači, na kolicima, na nogarima i na policama.", "Lavori a caldo (saldatura, molatura, ossitaglio) solo con permesso a caldo ed estintore a portata di mano. Mai vicino ai depositi di bombole, vernici e gasolio.": "Radovi sa vatrom (varenje, brušenje, rezanje plamenom) samo uz dozvolu za vruće radove i aparat za gašenje pri ruci. Nikad blizu skladišta boca, boja i dizela.", "Mai saldare o intervenire su un circuito in pressione o su un compressore collegato: prima scaricare e verificare lo zero.": "Nikad ne vari i ne radi na krugu pod pritiskom ili na priključenom kompresoru: prvo ispusti pritisak i provjeri da je na nuli.", "Occhiali sempre con utensili a percussione, mole, aghi e aria compressa. L'aria compressa non si punta mai su una persona né sui vestiti.": "Naočale uvijek uz udarne alate, brusilice, igle i komprimirani zrak. Komprimirani zrak se nikad ne usmjerava na osobu ni na odjeću.", "Attrezzatura integra o fuori servizio: mole incrinate, utensili a percussione con testa deformata o sbavata, funi con fili rotti, scale su fondo instabile non si usano.": "Oprema ispravna ili van upotrebe: napukli diskovi, udarni alati sa deformisanom glavom, sajle sa pokidanim žicama, ljestve na nestabilnoj podlozi se ne koriste.", "In quota: imbracatura agganciata a un ancoraggio idoneo, tre punti d'appoggio sulla scala, retrattile da revisionare dopo ogni caduta.": "Na visini: pojas zakačen za odgovarajuće sidrište, tri tačke oslonca na ljestvama, samonamotavajući uređaj se servisira nakon svakog pada.", "Quadri elettrici e impianto fisso gas: Delfapi non fa manutenzione. Anomalia = chiudere, scollegare e segnalare.": "Električni ormari i fiksna plinska instalacija: Delfapi ne radi održavanje. Kvar = zatvori, isključi i prijavi.", "DPI per lavorazione": "LZO prema vrsti posla", "Dotazione base, sempre in tutto il cantiere: casco di protezione, occhiali EN 166, guanti di protezione meccanica EN 388, indumenti ad alta visibilità e aderenti, scarpe di sicurezza S3 antiscivolo. Ogni scheda qui sotto ripete l'elenco completo per la lavorazione: in grassetto cosa è specifico.": "Osnovna oprema, uvijek na cijelom gradilištu: zaštitna kaciga, naočale EN 166, rukavice za mehaničku zaštitu EN 388, reflektujuća i pripijena odjeća, zaštitne cipele S3 protiv klizanja. Svaka kartica ispod ponavlja cijeli spisak za posao: podebljano je ono što je posebno.", "Saldatura MMA / TIG / MIG, taglio al plasma, scriccatura": "Varenje MMA / TIG / MIG, rezanje plazmom, žlijebljenje", "Casco di protezione": "Zaštitna kaciga", "Maschera da saldatura DIN 9–13 (EN 379), sopra gli occhiali EN 166": "Maska za varenje DIN 9–13 (EN 379), preko naočala EN 166", "Facciale filtrante FFP3; scriccatura: P3 a carboni attivi": "Zaštitna maska FFP3; žlijebljenje: P3 sa aktivnim ugljem", "Otoprotettori EN 352": "Zaštita za uši EN 352", "Guanti da saldatore in crosta": "Kožne rukavice za varioce", "Giacca e pantaloni ignifughi": "Vatrootporna jakna i pantalone", "Scarpe di sicurezza S3": "Zaštitne cipele S3", "Fa fede l'analisi dei rischi della singola attività.": "Važi analiza rizika za svaku pojedinu aktivnost.", "Ossitaglio al cannello": "Rezanje plamenikom", "Occhiali da ossitaglio con filtro": "Naočale za rezanje plamenom sa filterom", "Guanti da saldatore": "Rukavice za varioce", "Grembiule o giacca ignifuga": "Vatrootporna kecelja ili jakna", "I tornelli, furgone, spogliatoi e arrivo in NCB.": "Portirnica, okretna vrata, kombi, svlačionice i dolazak u NCB.", "Come raggiungere la sede Delfapi": "Kako doći do sjedišta Delfapi", "Via San Rocco 12, Solto Collina (BG), tel. 035 980143. Navigatore, riconoscere la sede, dove parcheggiare (auto e camion), cosa fare all'arrivo.": "Via San Rocco 12, Solto Collina (BG), tel. 035 980143. Navigacija, kako prepoznati sjedište, gdje parkirati (auta i kamioni), šta raditi po dolasku.", "Regole valide in tutto il cantiere.": "Pravila koja važe na cijelom gradilištu.", "Campata forno elettrico.": "Hala elektrolučne peći.", "Colata continua e pozzo rottami.": "Kontinuirano livenje i jama za otpad.", "Capannone NCB: banchi, officina, stoccaggio.": "Hala NCB: radni stolovi, radionica, skladište.", "Cesoia Vezzani e area Gate 207.": "Makaze Vezzani i zona Gate 207.", "Sollevamento, imbracature, consegne ai reparti.": "Dizanje, vezivanje tereta, dostave pogonima.", "Sostituzione lame cesoia Vezzani": "Zamjena noževa makaza Vezzani", "Parco Rottame, Gate 207. DPI obbligatori, messa in sicurezza (Tenaris) e ingresso, rimozione lame, pulizia sedi, nuove lame inferiori, lame superiori con martinetto.": "Parco Rottame, Gate 207. Obavezna LZO, osiguranje postrojenja (Tenaris) i ulaz, vađenje noževa, čišćenje ležišta, novi donji noževi, gornji noževi pomoću dizalice.", "NCB – Analisi dei rischi": "NCB – Analiza rizika", "Ingresso e DPI, corsia di transito, carichi sospesi, saldatura e taglio, seghetto/trapano/pressa, scaffalatura, ordine e pulizia, buca siviere, depositi esterni.": "Ulaz i LZO, prolaz, viseći tereti, varenje i rezanje, pila/bušilica/presa, police, red i čistoća, jama za lonce, vanjska skladišta.", "Sostituzione pompa fossa scaglie CCO1": "Zamjena pumpe u jami za okujinu CCO1", "Analisi dei rischi: posizionamento con muletto, scollegamento tubazioni, smontaggio bulloni, imbraco (sollevamento con carroponte Dalmine), montaggio e collegamento.": "Analiza rizika: postavljanje viljuškarom, odvajanje cijevi, skidanje vijaka, vezivanje (dizanje kranom Dalmine), montaža i povezivanje.", "Controllo delle brache prima dell'uso": "Kontrola traka prije upotrebe", "Guarda e tocca tutta la braca: tessuto, cuciture, calore, prodotti chimici, asole e accessori. Un solo difetto: non usarla, contenitore rosso FUORI USO e avvisa il preposto. Paraspigoli durante il sollevamento.": "Pogledaj i opipaj cijelu traku: tkaninu, šavove, toplotu, hemikalije, ušice i pribor. Jedan jedini kvar: ne koristi je, stavi u crveni kontejner FUORI USO i obavijesti nadređenog. Štitnici za ivice pri dizanju.", "Sito riservato al personale Delfapi. Inserisci il PIN.": "Sajt samo za radnike Delfapi. Unesi PIN.", "Entra": "Uđi", "PIN non corretto.": "Pogrešan PIN.", "Il PIN ti viene comunicato dal preposto o in ufficio Delfapi.": "PIN ti daje nadređeni ili ured Delfapi.", "Scrivi una domanda…": "Napiši pitanje… (na italijanskom)"}, "ar": {"NUOVO": "جديد", "Mettila tra le app del telefono": "أضفه إلى تطبيقات الهاتف", "Icona Delfapi sulla Home, apertura a tutto schermo, funziona anche senza campo.": "أيقونة Delfapi على الشاشة الرئيسية، تفتح بملء الشاشة، وتعمل حتى بدون تغطية.", "Installa": "تثبيت", "Sei senza campo: vedi i contenuti salvati sul telefono.": "لا توجد تغطية: أنت ترى المحتوى المحفوظ على الهاتف.", "Dall’ufficio": "من المكتب", "Informazioni": "معلومات", "entro il": "قبل", "Corsi": "دورات", "Visite mediche": "فحوص طبية", "Emergenza": "الطوارئ", "Da sapere a memoria: i numeri, il tuo gate e cosa fare nei primi minuti.": "احفظها جيداً: الأرقام، رقم البوابة (gate) الخاصة بك، وما يجب فعله في الدقائق الأولى.", "Emergenze Tenaris Dalmine": "طوارئ Tenaris Dalmine", "Incendio": "حريق", "CHIAMA": "اتصل", "Infortunio": "إصابة عمل", "Gate del cantiere": "بوابات الموقع (gate)", "Ai soccorsi si comunica il numero del gate: memorizza quello della tua zona.": "يُبلَّغ المسعفون برقم البوابة (gate): احفظ رقم بوابة منطقتك.", "Servizi": "الخدمات", "Planimetria con gate e punti di raccolta: chiedila al preposto.": "مخطط البوابات ونقاط التجمّع: اطلبه من المشرف.", "Apri la planimetria completa": "افتح المخطط الكامل", "Cosa faccio se…": "ماذا أفعل إذا…", "1. Metti in sicurezza te stesso. Non spostare l'infortunato, a meno che sia in pericolo immediato.\n2. Chiama il 035 560 3444 e di': cosa è successo, dove sei (numero del gate), quante persone coinvolte.\n3. Manda un collega al gate ad aspettare i soccorsi e guidarli.\n4. Avvisa il preposto Delfapi.": "1. احمِ نفسك أولاً. لا تحرّك المصاب إلا إذا كان في خطر مباشر.\n2. اتصل بالرقم 035 560 3444 وقل: ماذا حدث، أين أنت (رقم البوابة gate)، وكم عدد الأشخاص المصابين.\n3. أرسل زميلاً إلى البوابة لانتظار المسعفين وإرشادهم.\n4. أبلغ المشرف (preposto) في Delfapi.", "Principio d'incendio": "بداية حريق", "1. Chiama il 035 560 3555 e comunica il numero del gate.\n2. Se il fuoco è piccolo e sai usare l'estintore, intervieni restando tra il fuoco e la via di fuga. Altrimenti allontanati.\n3. Se puoi farlo senza rischio, chiudi le bombole e allontana cannello e saldatrice.\n4. Avvisa il preposto Delfapi.": "1. اتصل بالرقم 035 560 3555 وأبلغ رقم البوابة (gate).\n2. إذا كانت النار صغيرة وتعرف استخدام طفاية الحريق، تدخّل وأنت بين النار وطريق الهروب. وإلا فابتعد.\n3. إذا أمكنك ذلك دون خطر، أغلق الأسطوانات وأبعد مشعل القطع وآلة اللحام.\n4. أبلغ المشرف (preposto) في Delfapi.", "Sversamento": "انسكاب سوائل", "1. Ferma la fonte se è sicuro farlo (rubinetto, valvola, fusto).\n2. Non far arrivare il liquido ai tombini: usa sabbia o il materiale assorbente del cantiere.\n3. Avvisa il preposto Delfapi e il referente Tenaris, che decide se chiamare il 035 560 3555.\n4. Non riprendere il lavoro finché l'area non è pulita e autorizzata.": "1. أوقف مصدر التسرب إذا كان ذلك آمناً (حنفية، صمام، برميل).\n2. لا تدع السائل يصل إلى المصارف: استخدم الرمل أو المواد الماصة الموجودة في الموقع.\n3. أبلغ المشرف في Delfapi والمسؤول في Tenaris، الذي يقرر الاتصال بالرقم 035 560 3555.\n4. لا تستأنف العمل حتى تُنظَّف المنطقة ويُسمح بالعمل.", "Allarme di stabilimento": "إنذار المصنع", "1. Interrompi il lavoro in sicurezza: spegni cannello e saldatrice, scendi dalla quota se puoi, lascia l'attrezzatura.\n2. Raggiungi il punto di raccolta più vicino tra quelli segnati sulla planimetria (simbolo verde con le quattro frecce), percorrendo le strade esterne. Non entrare nei reparti.\n3. Aspetta il preposto, che fa la conta. Non usare l'auto.\n4. Non tornare indietro finché non viene dichiarato il cessato allarme.": "1. أوقف العمل بأمان: أطفئ مشعل القطع وآلة اللحام، وانزل من المكان المرتفع إن أمكن، واترك المعدات.\n2. اذهب إلى أقرب نقطة تجمّع موضحة على المخطط (الرمز الأخضر ذو الأسهم الأربعة)، عبر الطرق الخارجية. لا تدخل الأقسام.\n3. انتظر المشرف الذي يقوم بعدّ الأشخاص. لا تستخدم السيارة.\n4. لا تعد حتى يُعلن انتهاء الإنذار.", "Tocca per ingrandire la planimetria": "المس لتكبير المخطط", "Procedure": "الإجراءات", "Scegli la tua area e guarda il video": "اختر منطقتك وشاهد الفيديو", "prima": "قبل", "di iniziare il lavoro. Se qualcosa non ti è chiaro, chiedi al preposto.": "أن تبدأ العمل. إذا لم يكن شيء واضحاً، اسأل المشرف.", "Sicurezza": "السلامة", "Movimentazione": "المناولة والرفع", "Nuovi assunti": "الموظفون الجدد", "Regole e DPI": "القواعد ومعدات الحماية", "Le dieci regole che valgono sempre e, per ogni lavorazione, l'elenco completo di cosa indossare. Ricavate dalle analisi dei rischi Delfapi.": "القواعد العشر السارية دائماً، ولكل عمل القائمة الكاملة لما يجب ارتداؤه. مأخوذة من تحليلات المخاطر في Delfapi.", "Le dieci regole d’oro": "القواعد الذهبية العشر", "Prima di accedere a un impianto Tenaris e di intervenire: procedura di accesso, MIS e LOTO. Si inizia solo dopo la conferma di messa in sicurezza da parte di Tenaris.": "قبل الدخول إلى منشأة Tenaris والتدخل: إجراءات الدخول وMIS وLOTO. لا يبدأ العمل إلا بعد أن تؤكد Tenaris أن المنشأة مؤمّنة.", "Mai sotto il carico sospeso, mai nel raggio di rotazione. Il sollevamento di prova a pochi centimetri è obbligatorio.": "لا تقف أبداً تحت الحمولة المعلّقة ولا في نطاق دورانها. الرفع التجريبي لبضعة سنتيمترات إلزامي.", "Brache, funi, grilli, golfari: portata (WLL) leggibile e rispettata, tenendo conto dell'angolo. Marcatura illeggibile o difetto = fuori uso.": "الحبال والكابلات والأقفال (grilli) وحلقات الرفع: يجب أن تكون الحمولة (WLL) مقروءة ومحترمة مع مراعاة الزاوية. علامة غير مقروءة أو عيب = خارج الخدمة.", "Tubi, rulli e barre rotolano: sempre cunei o traverse, sui carrelloni, sui cavalletti e sugli scaffali.": "الأنابيب والبكرات والقضبان تتدحرج: استخدم دائماً الأسافين أو العوارض على العربات والحوامل والرفوف.", "Lavori a caldo (saldatura, molatura, ossitaglio) solo con permesso a caldo ed estintore a portata di mano. Mai vicino ai depositi di bombole, vernici e gasolio.": "الأعمال الساخنة (اللحام، الجلخ، القطع بالأكسجين) فقط بتصريح عمل ساخن وطفاية حريق في متناول اليد. أبداً بالقرب من مخازن الأسطوانات والدهانات والديزل.", "Mai saldare o intervenire su un circuito in pressione o su un compressore collegato: prima scaricare e verificare lo zero.": "لا تلحم ولا تتدخل أبداً في دائرة تحت الضغط أو في ضاغط موصول: أفرغ الضغط أولاً وتأكد من وصوله إلى الصفر.", "Occhiali sempre con utensili a percussione, mole, aghi e aria compressa. L'aria compressa non si punta mai su una persona né sui vestiti.": "النظارات دائماً مع أدوات الطرق والجلاخات والإبر والهواء المضغوط. لا يُوجَّه الهواء المضغوط أبداً نحو شخص أو نحو الملابس.", "Attrezzatura integra o fuori servizio: mole incrinate, utensili a percussione con testa deformata o sbavata, funi con fili rotti, scale su fondo instabile non si usano.": "المعدات إما سليمة أو خارج الخدمة: لا تُستخدم الأقراص المتشققة، ولا أدوات الطرق ذات الرأس المشوّه، ولا الكابلات ذات الأسلاك المقطوعة، ولا السلالم على أرض غير مستقرة.", "In quota: imbracatura agganciata a un ancoraggio idoneo, tre punti d'appoggio sulla scala, retrattile da revisionare dopo ogni caduta.": "في الأماكن المرتفعة: حزام الأمان مثبّت بنقطة تثبيت مناسبة، ثلاث نقاط ارتكاز على السلّم، ويُفحص جهاز منع السقوط بعد كل سقوط.", "Quadri elettrici e impianto fisso gas: Delfapi non fa manutenzione. Anomalia = chiudere, scollegare e segnalare.": "اللوحات الكهربائية وشبكة الغاز الثابتة: Delfapi لا تقوم بصيانتها. أي خلل = أغلق، افصل، وأبلغ.", "DPI per lavorazione": "معدات الحماية حسب العمل", "Dotazione base, sempre in tutto il cantiere: casco di protezione, occhiali EN 166, guanti di protezione meccanica EN 388, indumenti ad alta visibilità e aderenti, scarpe di sicurezza S3 antiscivolo. Ogni scheda qui sotto ripete l'elenco completo per la lavorazione: in grassetto cosa è specifico.": "التجهيز الأساسي، دائماً وفي كل الموقع: خوذة حماية، نظارات EN 166، قفازات حماية ميكانيكية EN 388، ملابس عاكسة وضيقة، وأحذية سلامة S3 مانعة للانزلاق. كل بطاقة أدناه تكرر القائمة الكاملة للعمل: الخط العريض لما هو خاص.", "Saldatura MMA / TIG / MIG, taglio al plasma, scriccatura": "لحام MMA / TIG / MIG، قطع بالبلازما، تخديد بالقوس", "Casco di protezione": "خوذة حماية", "Maschera da saldatura DIN 9–13 (EN 379), sopra gli occhiali EN 166": "قناع لحام DIN 9–13 ‏(EN 379) فوق نظارات EN 166", "Facciale filtrante FFP3; scriccatura: P3 a carboni attivi": "كمامة FFP3؛ للتخديد: P3 بالكربون النشط", "Otoprotettori EN 352": "واقيات الأذن EN 352", "Guanti da saldatore in crosta": "قفازات لحام جلدية", "Giacca e pantaloni ignifughi": "سترة وبنطال مقاومان للهب", "Scarpe di sicurezza S3": "أحذية سلامة S3", "Fa fede l'analisi dei rischi della singola attività.": "المرجع هو تحليل المخاطر الخاص بكل نشاط.", "Ossitaglio al cannello": "القطع بالأكسجين بالمشعل", "Occhiali da ossitaglio con filtro": "نظارات القطع بالأكسجين مع فلتر", "Guanti da saldatore": "قفازات لحام", "Grembiule o giacca ignifuga": "مريلة أو سترة مقاومة للهب", "Indumenti ad alta visibilità": "ملابس عاكسة", "Molatura con smerigliatrice, scrostatore ad aghi, martello demolitore": "الجلخ بالجلاخة، المكشطة الإبرية، مطرقة الهدم", "Visiera o occhiali a mascherina EN 166": "واقي وجه أو نظارات محكمة EN 166", "Facciale filtrante FFP2 / FFP3": "كمامة FFP2 / FFP3", "Guanti EN 388; antivibranti per scrostatore e demolito
