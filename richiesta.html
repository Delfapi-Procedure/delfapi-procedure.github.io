<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Richiesta materiale – Delfapi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003d63">
<link rel="icon" type="image/png" href="icona-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blu:#005387;--blu-scuro:#003d63;--carta:#fff;--fondo:#eef1f4;--riga:#cfd6dd;--testo:#141414;--testo-2:#4a5560;--giallo:#f2b600;--rosso:#b4231a;--ok:#1e7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}}
:root[data-theme="dark"]{color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--fondo);color:var(--testo);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blu-scuro);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",Impact,"Arial Narrow",sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--giallo);outline-offset:2px}
.testata{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--blu-scuro);color:#fff;border-bottom:6px solid var(--giallo)}
.testata-in{max-width:760px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.testata img{width:48px;height:48px;border-radius:50%;background:#fff;padding:8px 7px 6px;object-fit:contain;flex:0 0 auto}
.testata h1{font-size:clamp(21px,6vw,28px);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}.testata .sotto{font-size:14px;opacity:.9;margin-top:2px}
.testata-in>div{flex:1 1 auto;min-width:0}
.esci{flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-weight:600}.esci[hidden]{display:none}
.indietro{display:none;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:26px;flex:0 0 auto}.indietro.on{display:block}
.pagina{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.avviso{background:#fff6d6;color:#141414;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.btn.verde{background:var(--ok);border-color:var(--ok)}.btn.annulla{background:transparent;color:var(--testo-2);border-color:var(--riga)}
.campo{display:block;margin-top:12px}.campo span{display:block;font-weight:600;margin-bottom:4px}
.campo input,.campo textarea{width:100%;min-height:48px;border:2px solid var(--riga);border-radius:10px;background:var(--fondo);color:var(--testo);padding:10px 12px;font:inherit}
.campo textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--blu);background:var(--blu);color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.btn.sec{background:transparent;color:var(--blu)}.btn[disabled]{opacity:.5}
.esito{margin-top:12px;padding:12px;border-radius:10px;font-weight:600;display:none}.esito.on{display:block}.esito.ok{background:#dff5d8;color:#14501f}.esito.ko{background:#ffd6d1;color:#7a120c}.esito.info{background:var(--fondo);color:var(--testo-2)}
.vuoto{color:var(--testo-2);text-align:center;padding:30px 10px}
.torna{display:block;text-align:center;margin-top:20px;color:var(--blu);font-weight:600}
.pin{position:fixed;inset:0;z-index:30;background:var(--blu-scuro);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.pin-box{width:100%;max-width:340px;text-align:center}.pin-box h1{font-size:28px;text-transform:uppercase;margin:12px 0 6px}
.pin-box input{width:100%;height:58px;border:0;border-radius:12px;font:700 30px "Barlow Condensed",sans-serif;letter-spacing:.3em;text-align:center;color:#141414;background:#fff}
.pin-box button{margin-top:12px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--giallo);color:#141414;font-weight:700;font-size:18px}
.pin-box .err{min-height:22px;margin-top:8px;color:#ffd6d1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.aiuto{color:var(--testo-2);font-size:15px;margin:0 2px 6px}
.cath{display:flex;align-items:center;gap:10px;font-size:24px;margin:18px 0 8px}.cath i{font-style:normal;width:10px;height:26px;border-radius:3px;background:var(--c,#f2b600)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;border:2px solid var(--riga);background:var(--carta);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:112px;user-select:none;-webkit-user-select:none}
.tile .ic{height:48px;display:grid;place-items:center;font-size:36px;line-height:1}.tile .ic svg{height:48px;width:auto}
.tile span{font-size:13.5px;font-weight:600;line-height:1.12;text-align:center}
.tile b{position:absolute;top:-8px;right:-6px;min-width:28px;height:28px;border-radius:14px;background:#e8590c;color:#fff;font:700 17px/28px "Barlow Condensed",sans-serif;text-align:center;padding:0 6px;display:none}
.tile.on{border-color:#e8590c}.tile.on b{display:block}
.tile:active{transform:scale(.96)}
.tile.nuovo{border-style:dashed;color:var(--blu);justify-content:center}
.passo{display:flex;align-items:center;gap:10px;font-size:26px;margin:22px 0 10px}.passo>span:first-child{flex:0 0 34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:20px}.passo small{font:600 15px "Barlow",sans-serif;color:#e8590c}
.foglio{background:#fff;color:#141414;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}
.foglio .vuoto{padding:22px 12px;color:#6a7480;text-align:center}
.li{display:grid;grid-template-columns:1fr auto 30px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid #e3ebf3}.li:first-child{border-top:0}
.li .n{font-weight:600;font-size:16px;line-height:1.15}.li .n small{display:block;font-weight:400;color:#4a5560;font-size:13px}
.li .q{display:flex;align-items:center;border:2px solid #cfd6dd;border-radius:10px;overflow:hidden}
.li .q button{width:38px;height:40px;border:0;background:#eef4fa;font:700 22px "Barlow Condensed",sans-serif;color:#003d63}
.li .q input{width:44px;height:40px;border:0;text-align:center;font:700 21px "Barlow Condensed",sans-serif;color:#141414;background:#fff}
.li .x{border:0;background:transparent;color:#b4231a;font-size:22px}
.li .nt{grid-column:1/-1;border:0;border-bottom:1px dashed #cfd6dd;background:transparent;font:14px "Barlow",sans-serif;color:#141414;padding:2px 0}
.btn.verde{background:var(--ok);border-color:var(--ok)}.btn.wa{background:#1fa855;border-color:#1fa855}
.azioni{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.azioni .btn{flex:1 1 150px}
.svuota{border:0;background:transparent;color:var(--rosso);font-weight:600;margin-top:10px;padding:6px 0}
.campo textarea{width:100%}

</style>
</head>
<body>
<header class="testata"><div class="testata-in">
  <img src="marchio.png" alt="Delfapi">
  <div><h1>Richiesta materiale</h1><div class="sotto" id="sotto">DPI e consumabili</div></div>
  <button class="esci" id="esci" hidden>Esci</button>
</div></header>
<main class="pagina">
  <div class="avviso" id="modo" hidden></div>
  <p class="aiuto">Tocca quello che manca: ogni tocco aggiunge 1 alla lista. Le quantità si correggono in fondo.</p>
  <div id="cat"></div>
  <h2 class="passo"><span>✓</span> La lista <small id="n-lista"></small></h2>
  <div class="foglio" id="lista"></div>
  <label class="campo"><span>Note (facoltative)</span><textarea id="nota" placeholder="Es. guanti taglia 10, consegna in NCB"></textarea></label>
  <div class="azioni"><button class="btn wa" id="wa">Manda su WhatsApp</button><button class="btn verde" id="invia">Invia in ufficio</button></div>
  <button class="svuota" id="svuota">Svuota la lista</button>
  <div class="esito" id="esito"></div>
  <a class="torna" href="./">‹ Torna a Procedure e sicurezza</a>
</main>

<script>
(function(){
"use strict";
var API = "";                 // indirizzo /exec dell'app web Google (da inserire)
var CHIAVE = "dlf-7Q4k-ctrl";
var PIN_ANTEPRIMA = "6606753e5a126d7068012a526d44c3eb2f7fcd09d5faeb30c77dbfd87ca7e758";
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function oggiIso(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dIt(iso){ var p=String(iso).slice(0,10).split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso; }
var OP=null; try{ OP=JSON.parse(localStorage.getItem("op-ctrl")||"null"); }catch(e){}
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function post(o){ o.chiave=CHIAVE; return fetch(API,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()}); }
function schermoPin(titolo, testo, prova){
  var d=document.createElement("div"); d.className="pin";
  d.innerHTML='<div class="pin-box"><img src="marchio.png" alt="" style="width:90px;height:90px;border-radius:50%;background:#fff;padding:14px 12px 10px"><h1>'+esc(titolo)+'</h1><p>'+testo+'</p><input type="password" inputmode="numeric" maxlength="8" aria-label="PIN"><button>Entra</button><div class="err"></div><a href="./" style="color:#fff;display:inline-block;margin-top:16px">‹ Torna a Procedure e sicurezza</a></div>';
  document.body.appendChild(d); var i=d.querySelector("input"), b=d.querySelector("button"), er=d.querySelector(".err"); setTimeout(function(){i.focus()},100);
  function vai(){ var v=i.value.trim(); if(!v) return; b.disabled=true; er.textContent="Verifica…"; prova(v).then(function(msg){ b.disabled=false; if(msg){ er.textContent=msg; i.value=""; } else d.remove(); }); }
  b.onclick=vai; i.onkeydown=function(e){ if(e.key==="Enter") vai(); };
}
/* accesso: in anteprima PIN dell'area controlli; collegato al foglio, PIN personale + permesso */
function accesso(titolo, permesso, avvia){
  if(!API){
    var ok=false; try{ ok=localStorage.getItem("pin-ctrl")===PIN_ANTEPRIMA }catch(e){}
    if(ok){ avvia(null); return; }
    schermoPin(titolo,"Anteprima: inserisci il PIN dell'area controlli.",function(v){ return sha(v).then(function(h){ if(h!==PIN_ANTEPRIMA) return "PIN non corretto."; try{localStorage.setItem("pin-ctrl",h)}catch(e){} avvia(null); return ""; }); });
    return;
  }
  function conPin(pin){ return post({azione:"liste",pin:pin}).then(function(r){
      if(!r.ok) return r.errore==="pin"?"PIN non riconosciuto.":r.errore;
      if(!r[permesso]) return "Il tuo PIN non è abilitato a questa funzione.";
      OP={nome:r.nome,pin:pin}; try{localStorage.setItem("op-ctrl",JSON.stringify(OP))}catch(e){}
      avvia(r); return "";
    }).catch(function(){ return "Serve la connessione per entrare."; }); }
  if(OP&&OP.pin){ conPin(OP.pin).then(function(msg){ if(msg) schermoPin(titolo,"Entra con il tuo <b>PIN personale</b>.",conPin); }); }
  else schermoPin(titolo,"Entra con il tuo <b>PIN personale</b>.",conPin);
}
function esci(){ OP=null; try{localStorage.removeItem("op-ctrl")}catch(e){} location.reload(); }

function elettrodo(t,col){ return '<svg viewBox="0 0 60 48"><rect x="6" y="20" width="40" height="8" rx="3" fill="'+(col||"#8a6d3b")+'"/><rect x="44" y="21.5" width="12" height="5" rx="1" fill="#9aa3ab"/><text x="26" y="14" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="700" font-size="13" fill="currentColor">'+t+'</text></svg>'; }
function disco(t,taglio){ return '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="'+(taglio?"#c62828":"#2f3a44")+'"/><circle cx="24" cy="24" r="7" fill="var(--carta)"/><circle cx="24" cy="24" r="'+(taglio?19:17)+'" fill="none" stroke="#fff" stroke-width="'+(taglio?1:4)+'" opacity=".35"/><text x="24" y="44" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="700" font-size="10" fill="#fff">'+t+'</text></svg>'; }
function bobina(t){ return '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="14" fill="#c77d3a"/><circle cx="24" cy="24" r="5" fill="var(--carta)"/><text x="24" y="47" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="700" font-size="9" fill="currentColor">'+t+'</text></svg>'; }
var VETRO=function(scuro){ return '<svg viewBox="0 0 56 44"><rect x="4" y="6" width="48" height="32" rx="4" fill="'+(scuro?"#1b5e20":"#e3f2fd")+'" stroke="currentColor" stroke-width="2.5"/><path d="M12 14 l10 0" stroke="#fff" stroke-width="3" opacity=".7"/></svg>'; };
var MASCHERA='<svg viewBox="0 0 48 48"><path d="M8 10 q16 -8 32 0 v22 q-16 14 -32 0z" fill="#2f3a44"/><rect x="13" y="16" width="22" height="9" rx="2" fill="#1b5e20"/></svg>';
var UGELLO='<svg viewBox="0 0 48 48"><path d="M14 6 h20 l-3 30 h-14z" fill="#c77d3a"/><rect x="19" y="36" width="10" height="6" fill="#9aa3ab"/></svg>';
var CATEGORIE=[
 {n:"DPI",c:"#1f5fae",a:[["Tute bianche","🥼"],["Guanti da lavoro","🧤"],["Mascherine","😷"],["Tappi auricolari","👂"],["Cuffie antirumore","🎧"],["Occhiali di protezione","🥽"],["Occhiali da taglio (cannello)","🥽🔥"],["Vetrini trasparenti maschera saldatura",VETRO(false)],["Vetri scuri maschera saldatura",VETRO(true)],["Maschera da saldatura",MASCHERA]]},
 {n:"Saldatura",c:"#e8590c",a:[["Elettrodi basici Ø 3,25",elettrodo("Ø3,25")],["Elettrodi basici Ø 2,5",elettrodo("Ø2,5")],["Elettrodi Citoflex",elettrodo("Citoflex","#a1887f")],["Elettrodi inox 316",elettrodo("316","#90a4ae")],["Elettrodi inox 308",elettrodo("308","#90a4ae")],["Elettrodi inox 309",elettrodo("309","#90a4ae")],["Filo pieno",bobina("pieno")],["Filo animato",bobina("animato")],["Ugelli torcia",UGELLO]]},
 {n:"Dischi",c:"#2f3a44",a:[["Disco da sbavo Ø 125",disco("125",false)],["Disco da taglio Ø 125",disco("125",true)],["Disco da sbavo Ø 230",disco("230",false)],["Disco da taglio Ø 230",disco("230",true)]]}
];
var LISTA=[];
function altri(){ try{ return JSON.parse(localStorage.getItem("ric-altri")||"[]"); }catch(e){ return []; } }
function salva(){ try{ localStorage.setItem("ric-bozza",JSON.stringify({lista:LISTA,nota:$("#nota").value})); }catch(e){} }
function qta(n){ var r=LISTA.filter(function(x){return x.n===n})[0]; return r?r.q:0; }
function disegnaCat(){
  var cats=CATEGORIE.concat([{n:"Altro",c:"#7a8590",a:altri().map(function(x){return [x,"📦"]})}]);
  $("#cat").innerHTML=cats.map(function(c){ return '<h2 class="cath" style="--c:'+c.c+'"><i></i>'+esc(c.n)+'</h2><div class="tiles">'+
    c.a.map(function(a){ var q=qta(a[0]); return '<button class="tile'+(q?" on":"")+'" data-n="'+esc(a[0])+'"><div class="ic">'+a[1]+'</div><span>'+esc(a[0])+'</span><b>'+q+'</b></button>'; }).join("")+
    (c.n==="Altro"?'<button class="tile nuovo" id="nuovo"><div class="ic">＋</div><span>Aggiungi un altro articolo</span></button>':'')+'</div>'; }).join("");
  document.querySelectorAll(".tile[data-n]").forEach(function(b){ b.onclick=function(){ cambia(b.dataset.n,1); if(navigator.vibrate) navigator.vibrate(15); }; });
  $("#nuovo").onclick=function(){ var t=(prompt("Nome dell'articolo (resterà tra i pulsanti di questo telefono):")||"").trim(); if(!t) return; var a=altri(); if(a.indexOf(t)<0){ a.push(t); try{localStorage.setItem("ric-altri",JSON.stringify(a))}catch(e){} } cambia(t,1); };
}
function cambia(n,d){ var r=LISTA.filter(function(x){return x.n===n})[0]; if(!r){ if(d<=0) return; r={n:n,q:0,nt:""}; LISTA.push(r); } r.q=Math.max(0,r.q+d); if(!r.q) LISTA=LISTA.filter(function(x){return x!==r}); salva(); disegnaCat(); disegnaLista(); }
function disegnaLista(){
  $("#n-lista").textContent=LISTA.length?LISTA.length+(LISTA.length===1?" articolo":" articoli"):"";
  if(!LISTA.length){ $("#lista").innerHTML='<div class="vuoto">Ancora niente: tocca le icone qui sopra.</div>'; return; }
  $("#lista").innerHTML=LISTA.map(function(r,i){ return '<div class="li"><div class="n">'+esc(r.n)+'</div><div class="q"><button data-i="'+i+'" data-d="-1" aria-label="Meno">−</button><input data-i="'+i+'" inputmode="numeric" value="'+r.q+'" aria-label="Quantità"><button data-i="'+i+'" data-d="1" aria-label="Più">+</button></div><button class="x" data-i="'+i+'" aria-label="Togli">×</button><input class="nt" data-i="'+i+'" placeholder="dettaglio: taglia, diametro, confezioni…" value="'+esc(r.nt||"")+'"></div>'; }).join("");
  document.querySelectorAll(".li .q button").forEach(function(b){ b.onclick=function(){ cambia(LISTA[+b.dataset.i].n,+b.dataset.d); }; });
  document.querySelectorAll(".li .q input").forEach(function(x){ x.onchange=function(){ var r=LISTA[+x.dataset.i], v=parseInt(x.value,10)||0; cambia(r.n,v-r.q); }; });
  document.querySelectorAll(".li .x").forEach(function(b){ b.onclick=function(){ LISTA.splice(+b.dataset.i,1); salva(); disegnaCat(); disegnaLista(); }; });
  document.querySelectorAll(".li .nt").forEach(function(x){ x.oninput=function(){ LISTA[+x.dataset.i].nt=x.value; salva(); }; });
}
function testo(){ var d=new Date(); return "Richiesta materiale – "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+(OP?" – "+OP.nome:"")+"\n\n"+
  LISTA.map(function(r){ return "• "+r.q+" × "+r.n+(r.nt?" ("+r.nt+")":""); }).join("\n")+($("#nota").value?"\n\nNote: "+$("#nota").value:""); }
function esito(t,c){ var e=$("#esito"); e.className="esito on "+c; e.textContent=t; }
$("#wa").onclick=function(){ if(!LISTA.length) return esito("La lista è vuota.","ko"); window.open("https://wa.me/?text="+encodeURIComponent(testo()),"_blank"); };
$("#invia").onclick=function(){
  if(!LISTA.length) return esito("La lista è vuota.","ko");
  if(!API) return esito("Anteprima: non inviata in ufficio. Intanto puoi usare «Manda su WhatsApp».","info");
  if(!confirm("Inviare la richiesta in ufficio ("+LISTA.length+" articoli)?")) return;
  var b=$("#invia"); b.disabled=true; esito("Invio…","info");
  post({azione:"richiesta",pin:OP.pin,righe:LISTA.map(function(r){return {articolo:r.n,quantita:r.q,dettaglio:r.nt||""}}),nota:$("#nota").value}).then(function(r){
    b.disabled=false; if(!r.ok) return esito("Non inviata: "+r.errore,"ko");
    esito("Inviata in ufficio ("+r.righe+" articoli), copia per email a "+r.email+".","ok"); LISTA=[]; $("#nota").value=""; salva(); disegnaCat(); disegnaLista();
  }).catch(function(){ b.disabled=false; esito("Nessuna connessione: non inviata. La lista resta salvata, riprova.","ko"); });
};
$("#svuota").onclick=function(){ if(LISTA.length&&confirm("Svuotare la lista?")){ LISTA=[]; salva(); disegnaCat(); disegnaLista(); } };
$("#nota").addEventListener("input",salva); $("#esci").onclick=esci;
accesso("Richiesta materiale","richieste",function(r){
  if(r){ $("#esci").hidden=false; $("#sotto").textContent="DPI e consumabili · "+r.nome; }
  else { $("#modo").hidden=false; $("#modo").textContent="Anteprima: «Manda su WhatsApp» funziona già; «Invia in ufficio» funzionerà quando colleghiamo il foglio Google."; }
