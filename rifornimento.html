<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifornimento gasolio – Delfapi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003d63">
<link rel="icon" type="image/png" href="icona-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blu:#005387;--blu-scuro:#003d63;--carta:#fff;--fondo:#eef1f4;--riga:#cfd6dd;--testo:#141414;--testo-2:#4a5560;--giallo:#f2b600;--rosso:#b4231a;--ok:#1e7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}}
:root[data-theme="dark"]{color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--fondo);color:var(--testo);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blu-scuro);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",Impact,"Arial Narrow",sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--giallo);outline-offset:2px}
.testata{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--blu-scuro);color:#fff;border-bottom:6px solid var(--giallo)}
.testata-in{max-width:760px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.testata img{width:48px;height:48px;border-radius:50%;background:#fff;padding:8px 7px 6px;object-fit:contain;flex:0 0 auto}
.testata h1{font-size:clamp(21px,6vw,28px);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}.testata .sotto{font-size:14px;opacity:.9;margin-top:2px}
.testata-in>div{flex:1 1 auto;min-width:0}
.esci{flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-weight:600}.esci[hidden]{display:none}
.indietro{display:none;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:26px;flex:0 0 auto}.indietro.on{display:block}
.pagina{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.avviso{background:#fff6d6;color:#141414;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.btn.verde{background:var(--ok);border-color:var(--ok)}.btn.annulla{background:transparent;color:var(--testo-2);border-color:var(--riga)}
.campo{display:block;margin-top:12px}.campo span{display:block;font-weight:600;margin-bottom:4px}
.campo input,.campo textarea{width:100%;min-height:48px;border:2px solid var(--riga);border-radius:10px;background:var(--fondo);color:var(--testo);padding:10px 12px;font:inherit}
.campo textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--blu);background:var(--blu);color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.btn.sec{background:transparent;color:var(--blu)}.btn[disabled]{opacity:.5}
.esito{margin-top:12px;padding:12px;border-radius:10px;font-weight:600;display:none}.esito.on{display:block}.esito.ok{background:#dff5d8;color:#14501f}.esito.ko{background:#ffd6d1;color:#7a120c}.esito.info{background:var(--fondo);color:var(--testo-2)}
.vuoto{color:var(--testo-2);text-align:center;padding:30px 10px}
.torna{display:block;text-align:center;margin-top:20px;color:var(--blu);font-weight:600}
.pin{position:fixed;inset:0;z-index:30;background:var(--blu-scuro);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.pin-box{width:100%;max-width:340px;text-align:center}.pin-box h1{font-size:28px;text-transform:uppercase;margin:12px 0 6px}
.pin-box input{width:100%;height:58px;border:0;border-radius:12px;font:700 30px "Barlow Condensed",sans-serif;letter-spacing:.3em;text-align:center;color:#141414;background:#fff}
.pin-box button{margin-top:12px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--giallo);color:#141414;font-weight:700;font-size:18px}
.pin-box .err{min-height:22px;margin-top:8px;color:#ffd6d1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cist{background:var(--carta);border:1px solid var(--riga);border-radius:14px;padding:6px 10px;margin-bottom:6px}.cist svg{display:block;width:100%;max-height:170px}
#liv,#onda{transition:transform .5s ease}
@keyframes cade{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}#goccia.va{animation:cade .9s ease-in infinite}
.passo{display:flex;align-items:center;gap:10px;font-size:26px;margin:20px 0 10px}.passo>span:first-child{flex:0 0 34px;height:34px;border-radius:50%;background:#e8590c;color:#fff;display:grid;place-items:center;font-size:21px}
.mezzi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mz{border:3px solid var(--riga);border-radius:14px;background:var(--carta);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center}
.mz.on{border-color:#e8590c;box-shadow:0 0 0 3px rgba(232,89,12,.25)}
.mz small{color:var(--testo-2);font-size:14px;text-align:center;line-height:1.2}
.targa{display:flex;align-items:stretch;border:2px solid #141414;border-radius:6px;overflow:hidden;background:#fff;color:#141414;font:700 22px/1 "Barlow Condensed",Arial;letter-spacing:.06em}
.targa i{background:#003399;color:#fff;font-style:normal;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:3px 4px}
.targa i::before{content:"★";color:#ffcc00;font-size:10px;margin-bottom:auto;margin-top:1px}
.targa span{padding:6px 8px}
.mz svg{width:64px;height:56px}
.mz.esempio{opacity:.6}
.odo{display:flex;align-items:center;gap:10px;background:#141414;border-radius:12px;padding:10px 14px;box-shadow:inset 0 0 0 3px #3a3f45}
.odo input{flex:1;min-width:0;background:repeating-linear-gradient(90deg,#2b2f34 0 30px,#141414 30px 34px);color:#fff;border:0;border-radius:6px;font:700 36px/1.2 "Barlow Condensed",monospace;letter-spacing:.42em;padding:6px 8px}
.odo b{color:#f2b600;font:700 22px "Barlow Condensed",sans-serif}
.aiuto{color:var(--testo-2);font-size:14px;margin:6px 2px 0}
.litri{display:flex;align-items:baseline;gap:10px;border:3px solid var(--riga);border-radius:12px;background:var(--carta);padding:6px 14px}
.litri input{flex:1;min-width:0;border:0;background:transparent;color:var(--testo);font:700 48px "Barlow Condensed",sans-serif}
.litri b{font:700 24px "Barlow Condensed",sans-serif;color:var(--testo-2)}
.btn.verde{background:var(--ok);border-color:var(--ok)}.btn.grande{width:100%;margin-top:18px;min-height:60px;font-size:20px}
.campo input{width:100%}

</style>
</head>
<body>
<header class="testata"><div class="testata-in">
  <img src="marchio.png" alt="Delfapi">
  <div><h1>Rifornimento gasolio</h1><div class="sotto" id="sotto">Cisterna NCB</div></div>
  <button class="esci" id="esci" hidden>Esci</button>
</div></header>
<main class="pagina">
  <div class="avviso" id="modo" hidden></div>
  <section class="cist">
    <svg viewBox="0 0 320 150" aria-hidden="true">
      <defs><clipPath id="corpo"><rect x="30" y="22" width="230" height="96" rx="46"/></clipPath></defs>
      <rect x="30" y="22" width="230" height="96" rx="46" fill="var(--carta)" stroke="var(--testo)" stroke-width="4"/>
      <g clip-path="url(#corpo)"><rect id="liv" x="30" y="30" width="230" height="96" fill="#f2b600"/>
        <path id="onda" d="M30 30 q14 -6 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 v8 h-252z" fill="#f2b600"/></g>
      <rect x="30" y="22" width="230" height="96" rx="46" fill="none" stroke="var(--testo)" stroke-width="4"/>
      <rect x="132" y="8" width="26" height="16" rx="3" fill="var(--testo)"/>
      <rect x="60" y="118" width="14" height="22" fill="var(--testo)"/><rect x="216" y="118" width="14" height="22" fill="var(--testo)"/>
      <path d="M260 70 h22 a10 10 0 0 1 10 10 v26" fill="none" stroke="var(--testo)" stroke-width="6" stroke-linecap="round"/>
      <path d="M284 104 l16 0 l-4 18 l-10 0z" fill="var(--testo)"/>
      <circle id="goccia" cx="292" cy="132" r="5" fill="#f2b600" opacity="0"/>
      <text x="145" y="80" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="700" font-size="30" fill="#141414" id="cist-txt">GASOLIO</text>
    </svg>
  </section>

  <h2 class="passo"><span>1</span> Quale mezzo?</h2>
  <div class="mezzi" id="mezzi"></div>

  <h2 class="passo"><span>2</span> <span id="lab-lett">Contachilometri</span></h2>
  <label class="odo"><input id="lett" type="text" inputmode="numeric" placeholder="000000" aria-label="Lettura" maxlength="7"><b id="unita">km</b></label>
  <p class="aiuto" id="aiuto-lett">Scrivi il numero che vedi sul cruscotto.</p>

  <h2 class="passo"><span>3</span> Litri erogati</h2>
  <label class="litri"><input id="litri" type="text" inputmode="decimal" placeholder="0" aria-label="Litri"><b>litri</b></label>

  <label class="campo"><span>Nota (facoltativa)</span><input id="nota" placeholder="Es. tanica per generatore"></label>
  <button class="btn verde grande" id="registra">Registra rifornimento</button>
  <div class="esito" id="esito"></div>
  <a class="torna" href="./">‹ Torna a Procedure e sicurezza</a>
</main>

<script>
(function(){
"use strict";
var API = "";                 // indirizzo /exec dell'app web Google (da inserire)
var CHIAVE = "dlf-7Q4k-ctrl";
var PIN_ANTEPRIMA = "6606753e5a126d7068012a526d44c3eb2f7fcd09d5faeb30c77dbfd87ca7e758";
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function oggiIso(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dIt(iso){ var p=String(iso).slice(0,10).split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso; }
var OP=null; try{ OP=JSON.parse(localStorage.getItem("op-ctrl")||"null"); }catch(e){}
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function post(o){ o.chiave=CHIAVE; return fetch(API,{method:"POST",body:JSON.stringify(o)}).then(function(r){return r.json()}); }
function schermoPin(titolo, testo, prova){
  var d=document.createElement("div"); d.className="pin";
  d.innerHTML='<div class="pin-box"><img src="marchio.png" alt="" style="width:90px;height:90px;border-radius:50%;background:#fff;padding:14px 12px 10px"><h1>'+esc(titolo)+'</h1><p>'+testo+'</p><input type="password" inputmode="numeric" maxlength="8" aria-label="PIN"><button>Entra</button><div class="err"></div><a href="./" style="color:#fff;display:inline-block;margin-top:16px">‹ Torna a Procedure e sicurezza</a></div>';
  document.body.appendChild(d); var i=d.querySelector("input"), b=d.querySelector("button"), er=d.querySelector(".err"); setTimeout(function(){i.focus()},100);
  function vai(){ var v=i.value.trim(); if(!v) return; b.disabled=true; er.textContent="Verifica…"; prova(v).then(function(msg){ b.disabled=false; if(msg){ er.textContent=msg; i.value=""; } else d.remove(); }); }
  b.onclick=vai; i.onkeydown=function(e){ if(e.key==="Enter") vai(); };
}
/* accesso: in anteprima PIN dell'area controlli; collegato al foglio, PIN personale + permesso */
function accesso(titolo, permesso, avvia){
  if(!API){
    var ok=false; try{ ok=localStorage.getItem("pin-ctrl")===PIN_ANTEPRIMA }catch(e){}
    if(ok){ avvia(null); return; }
    schermoPin(titolo,"Anteprima: inserisci il PIN dell'area controlli.",function(v){ return sha(v).then(function(h){ if(h!==PIN_ANTEPRIMA) return "PIN non corretto."; try{localStorage.setItem("pin-ctrl",h)}catch(e){} avvia(null); return ""; }); });
    return;
  }
  function conPin(pin){ return post({azione:"liste",pin:pin}).then(function(r){
      if(!r.ok) return r.errore==="pin"?"PIN non riconosciuto.":r.errore;
      if(!r[permesso]) return "Il tuo PIN non è abilitato a questa funzione.";
      OP={nome:r.nome,pin:pin}; try{localStorage.setItem("op-ctrl",JSON.stringify(OP))}catch(e){}
      avvia(r); return "";
    }).catch(function(){ return "Serve la connessione per entrare."; }); }
  if(OP&&OP.pin){ conPin(OP.pin).then(function(msg){ if(msg) schermoPin(titolo,"Entra con il tuo <b>PIN personale</b>.",conPin); }); }
  else schermoPin(titolo,"Entra con il tuo <b>PIN personale</b>.",conPin);
}
function esci(){ OP=null; try{localStorage.removeItem("op-ctrl")}catch(e){} location.reload(); }

var MEZZI=[], SCELTO=null;
var DEMO=[{sigla:"H30D-02",descrizione:"Carrello elevatore Linde H30",targa:"",unita:"ore"},{sigla:"H45-394",descrizione:"Carrello elevatore Linde H45",targa:"",unita:"ore"},{sigla:"ESEMPIO",descrizione:"Furgone – esempio, targa da inserire",targa:"AB 123 CD",unita:"km",esempio:true}];
var MULETTO='<svg viewBox="0 0 64 56"><rect x="4" y="18" width="30" height="22" rx="3" fill="#e8590c"/><rect x="12" y="6" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3"/><rect x="40" y="4" width="4" height="40" fill="currentColor"/><rect x="44" y="38" width="18" height="4" fill="currentColor"/><circle cx="12" cy="44" r="7" fill="currentColor"/><circle cx="30" cy="44" r="7" fill="currentColor"/><circle cx="12" cy="44" r="3" fill="#fff"/><circle cx="30" cy="44" r="3" fill="#fff"/></svg>';
function disegnaMezzi(){
  $("#mezzi").innerHTML=MEZZI.map(function(m,i){
    var vis=m.targa?'<div class="targa"><i>I</i><span>'+esc(m.targa)+'</span></div>':MULETTO;
    return '<button class="mz'+(m.esempio?' esempio':'')+'" data-i="'+i+'">'+vis+'<small><b>'+esc(m.sigla==="ESEMPIO"?"":m.sigla)+'</b> '+esc(m.descrizione)+'</small></button>';
  }).join("");
  document.querySelectorAll(".mz").forEach(function(b){ b.onclick=function(){ SCELTO=MEZZI[+b.dataset.i]; document.querySelectorAll(".mz").forEach(function(x){x.classList.toggle("on",x===b)}); var ore=SCELTO.unita==="ore";
    $("#lab-lett").textContent=ore?"Contaore":"Contachilometri"; $("#unita").textContent=ore?"ore":"km"; $("#aiuto-lett").textContent=ore?"Scrivi le ore di lavoro che segna il contaore del muletto.":"Scrivi i chilometri che segna il cruscotto."; $("#lett").focus(); }; });
}
function livello(){
  var l=parseFloat(String($("#litri").value).replace(",","."))||0, f=Math.min(l/250,1);
  var y=f*80; $("#liv").style.transform="translateY("+y+"px)"; $("#onda").style.transform="translateY("+y+"px)";
  $("#goccia").classList.toggle("va",l>0); $("#cist-txt").textContent=l>0?("− "+String(l).replace(".",",")+" L"):"GASOLIO";
}
function esito(t,c){ var e=$("#esito"); e.className="esito on "+c; e.textContent=t; }
function registra(){
  if(!SCELTO) return esito("Scegli il mezzo.","ko");
  if(SCELTO.esempio) return esito("Quello è solo un esempio: le targhe vere arrivano a breve.","info");
  var lett=$("#lett").value.replace(/\D/g,""), litri=String($("#litri").value).replace(",",".");
  if(!lett) return esito("Scrivi la lettura del "+(SCELTO.unita==="ore"?"contaore":"contachilometri")+".","ko");
  if(!(parseFloat(litri)>0)) return esito("Scrivi i litri.","ko");
  if(!API) return esito("Anteprima: rifornimento non salvato. "+SCELTO.sigla+" · "+lett+" "+SCELTO.unita+" · "+litri.replace(".",",")+" litri.","info");
  var b=$("#registra"); b.disabled=true; esito("Registrazione…","info");
  post({azione:"rifornimento",pin:OP.pin,mezzo:SCELTO.sigla,lettura:lett,litri:litri,nota:$("#nota").value}).then(function(r){
    b.disabled=false; if(!r.ok) return esito("Non salvato: "+r.errore,"ko");
    esito("Registrato il "+r.quando+": "+SCELTO.sigla+", "+litri.replace(".",",")+" litri. Grazie!","ok");
    $("#lett").value=""; $("#litri").value=""; $("#nota").value=""; livello();
  }).catch(function(){ b.disabled=false; esito("Nessuna connessione: non salvato, riprova quando c'è campo.","ko"); });
}
$("#litri").addEventListener("input",livello); $("#lett").addEventListener("input",function(){ this.value=this.value.replace(/\D/g,""); });
$("#registra").onclick=registra; $("#esci").onclick=esci;
accesso("Rifornimento gasolio","rifornimento",function(r){
  MEZZI=r?r.mezzi:DEMO; if(r){ $("#esci").hidden=false; $("#sotto").textContent="Cisterna NCB · "+r.nome; }
  else { $("#modo").hidden=false; $("#modo").textContent="Anteprima: i muletti sono quelli veri, il furgone è un esempio. Niente viene salvato finché non colleghiamo il foglio Google."; }
  disegnaMezzi(); livello();
});

if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
