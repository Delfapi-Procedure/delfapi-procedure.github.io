<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controlli attrezzature – Delfapi</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blu:#005387;--blu-scuro:#003d63;--carta:#fff;--fondo:#eef1f4;--riga:#cfd6dd;--testo:#141414;--testo-2:#4a5560;--giallo:#f2b600;--rosso:#b4231a;--ok:#1e7a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}}
:root[data-theme="dark"]{color-scheme:dark;--blu:#2f8fd0;--blu-scuro:#005387;--carta:#1a1e23;--fondo:#0d0f11;--riga:#333b44;--testo:#f1f3f5;--testo-2:#aab4be}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--fondo);color:var(--testo);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blu-scuro);z-index:10}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",Impact,"Arial Narrow",sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--giallo);outline-offset:2px}
.testata{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--blu-scuro);color:#fff;border-bottom:6px solid var(--giallo)}
.testata-in{max-width:760px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.testata img{width:48px;height:48px;border-radius:50%;background:#fff;padding:8px 7px 6px;object-fit:contain;flex:0 0 auto}
.testata h1{font-size:clamp(21px,6vw,28px);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}.testata .sotto{font-size:14px;opacity:.9;margin-top:2px}
.testata-in>div{flex:1 1 auto;min-width:0}
.esci{flex:0 0 auto;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-weight:600}.esci[hidden]{display:none}
.firma{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:var(--fondo);border-radius:10px}.firma b{display:block}.firma small{color:var(--testo-2)}
.indietro{display:none;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:26px;flex:0 0 auto}.indietro.on{display:block}
.pagina{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.avviso{background:#fff6d6;color:#141414;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.sezioni{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.sezioni button{border:2px solid var(--blu);border-radius:10px;background:var(--carta);color:var(--blu);min-height:48px;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;padding:4px 8px;line-height:1.1}.sezioni button.on{background:var(--blu);color:#fff}
.conti{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.conto{border:0;border-radius:12px;background:var(--carta);border-top:6px solid var(--riga);padding:10px 8px;text-align:center}
.conto b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:34px;line-height:1}.conto span{font-size:13px;color:var(--testo-2)}
.conto.sc{border-top-color:var(--rosso)}.conto.is{border-top-color:var(--giallo)}.conto.ir{border-top-color:var(--ok)}.conto.fu{border-top-color:#6b1a14}
.conto.on{outline:3px solid var(--blu)}
.filtri{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filtri button{border:1px solid var(--riga);background:var(--carta);border-radius:999px;padding:8px 14px;font-size:15px}.filtri button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.cerca{width:100%;height:50px;border:2px solid var(--riga);border-radius:12px;background:var(--carta);color:var(--testo);padding:0 14px;font:inherit;margin-bottom:12px}
.lista{display:flex;flex-direction:column;gap:8px}
.mac{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--riga);background:var(--carta);border-radius:12px;padding:12px;border-left:10px solid var(--riga)}
.mac.SCADUTO{border-left-color:var(--rosso)}.mac.IN.SCADENZA,.mac.IN_SCADENZA{border-left-color:var(--giallo)}.mac.IN_REGOLA{border-left-color:var(--ok)}.mac.FUORI_USO{border-left-color:#6b1a14}
.mac .mini{flex:0 0 52px;width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--fondo)}
.foto{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:0 0 12px;background:var(--fondo)}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:12px}.docs a{color:var(--blu);font-weight:600;text-decoration:none;padding:8px 10px;border:1px solid var(--riga);border-radius:8px;background:var(--fondo)}
.altre{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}.altre .targa{margin-top:0}
.targa{display:inline-flex;align-items:center;gap:8px;margin-top:10px;color:var(--blu);font-weight:600;text-decoration:none}.targa img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--riga)}
.mac .id{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;min-width:62px}
.mac .t{flex:1;min-width:0}.mac .t b{display:block;font-weight:600;line-height:1.15}.mac .t small{display:block;color:var(--testo-2);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
.pill.SCADUTO{background:var(--rosso);color:#fff}.pill.IN_SCADENZA{background:var(--giallo);color:#141414}.pill.IN_REGOLA{background:var(--ok);color:#fff}.pill.FUORI_USO{background:#6b1a14;color:#fff}.pill.DA_PROGRAMMARE,.pill.DISMESSO{background:var(--riga);color:var(--testo)}
.mac .dx{text-align:right;flex:0 0 auto}.mac .dx small{display:block;font-size:13px;color:var(--testo-2);margin-top:3px}
.vista{display:none}.vista.on{display:block}
.box{background:var(--carta);border:1px solid var(--riga);border-radius:14px;padding:14px;margin-bottom:14px}
.box h2{font-size:28px;margin-bottom:4px}.box h3{font-size:22px;margin:0 0 10px}
.dati{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}.dati span{color:var(--testo-2)}
.voce{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--riga)}.voce:first-of-type{border-top:0}
.voce .n{flex:0 0 30px;height:30px;border-radius:8px;background:var(--blu);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.voce .txt{flex:1;font-size:16px;line-height:1.25}
.voce.chk{cursor:pointer}.voce.chk input{appearance:none;-webkit-appearance:none;flex:0 0 34px;width:34px;height:34px;border:3px solid var(--riga);border-radius:8px;background:var(--fondo);display:grid;place-items:center;margin:0}
.voce.chk input:checked{background:var(--ok);border-color:var(--ok)}.voce.chk input:checked::after{content:"";width:9px;height:17px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.btn.verde{background:var(--ok);border-color:var(--ok)}.btn.annulla{background:transparent;color:var(--testo-2);border-color:var(--riga)}
.stampa-link{display:inline-block;margin-top:12px;border:0;background:transparent;color:var(--blu);font-weight:600;padding:4px 0}
.sel{display:flex;flex:0 0 auto;border:2px solid var(--riga);border-radius:10px;overflow:hidden}
.sel button{border:0;background:transparent;min-width:62px;min-height:46px;font-weight:700;font-size:14px}
.sel button.ok.on{background:var(--ok);color:#fff}.sel button.ko.on{background:var(--rosso);color:#fff}
.campo{display:block;margin-top:12px}.campo span{display:block;font-weight:600;margin-bottom:4px}
.campo input,.campo textarea{width:100%;min-height:48px;border:2px solid var(--riga);border-radius:10px;background:var(--fondo);color:var(--testo);padding:10px 12px;font:inherit}
.campo textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--blu);background:var(--blu);color:#fff;font-weight:700;font-size:17px;text-decoration:none}
.btn.sec{background:transparent;color:var(--blu)}.btn[disabled]{opacity:.5}
.azioni{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.azioni .btn{flex:1 1 160px}
.esito{margin-top:12px;padding:12px;border-radius:10px;font-weight:600;display:none}.esito.on{display:block}.esito.ok{background:#dff5d8;color:#14501f}.esito.ko{background:#ffd6d1;color:#7a120c}.esito.info{background:var(--fondo);color:var(--testo-2)}
.storico{font-size:15px}.storico div{padding:8px 0;border-top:1px solid var(--riga)}.storico div:first-child{border-top:0}
.vuoto{color:var(--testo-2);text-align:center;padding:30px 10px}
.torna{display:block;text-align:center;margin-top:20px;color:var(--blu);font-weight:600}
/* PIN */
.pin{position:fixed;inset:0;z-index:30;background:var(--blu-scuro);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.pin-box{width:100%;max-width:340px;text-align:center}.pin-box h1{font-size:28px;text-transform:uppercase;margin:12px 0 6px}
.pin-box input{width:100%;height:58px;border:0;border-radius:12px;font:700 30px "Barlow Condensed",sans-serif;letter-spacing:.3em;text-align:center;color:#141414;background:#fff}
.pin-box button{margin-top:12px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--giallo);color:#141414;font-weight:700;font-size:18px}
.pin-box .err{min-height:22px;margin-top:8px;color:#ffd6d1}
/* stampa scheda */
#stampa{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}body::before,.testata,.pagina,.pin{display:none!important}
  #stampa{display:block;padding:0}
  #stampa h1{font-size:20px}#stampa table{width:100%;border-collapse:collapse;margin-top:8px}
  #stampa td,#stampa th{border:1px solid #000;padding:5px 6px;text-align:left;vertical-align:top}
  #stampa th{background:#ddd}
  @page{size:A4;margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function inSez(m){ return sezDi(m)===SEZ; }
function disegnaConti(){
  document.querySelectorAll("#sezioni button").forEach(function(b){ b.classList.toggle("on",b.dataset.s===SEZ); b.onclick=function(){ SEZ=b.dataset.s; try{localStorage.setItem("sez-ctrl",SEZ)}catch(e){} FILTRO=""; UB=""; disegna(); }; });
  var att=MAC.filter(function(m){return !m.Dismessa && inSez(m)});
  var c={}; att.forEach(function(m){c[m.stato]=(c[m.stato]||0)+1});
  var voci=[["SCADUTO","sc","Scadute"],["IN SCADENZA","is","In scadenza"],["IN REGOLA","ir","In regola"],["FUORI USO","fu","Fuori uso"]];
  $("#conti").innerHTML=voci.map(function(v){return '<button class="conto '+v[1]+(FILTRO===v[0]?" on":"")+'" data-f="'+v[0]+'"><b>'+(c[v[0]]||0)+'</b><span>'+v[2]+'</span></button>'}).join("");
  $("#conti").querySelectorAll("button").forEach(function(b){b.onclick=function(){ FILTRO=FILTRO===b.dataset.f?"":b.dataset.f; disegna(); }});
  var ubs=[""].concat(Array.from(new Set(att.map(function(m){return m.Ubicazione}))).sort());
  $("#filtri-ub").innerHTML=ubs.map(function(u){return '<button class="'+(UB===u?"on":"")+'" data-u="'+esc(u)+'">'+(u?esc(u.replace("Officina ","").replace("Cantiere ","Cant. ")):"Tutte")+'</button>'}).join("");
  $("#filtri-ub").querySelectorAll("button").forEach(function(b){b.onclick=function(){UB=b.dataset.u;disegna();}});
}
function disegna(){
  disegnaConti();
  var q=$("#cerca").value.trim().toLowerCase();
  var l=MAC.filter(function(m){
    if(!inSez(m)) return false;
    if(FILTRO && m.stato!==FILTRO) return false;
    if(!FILTRO && m.Dismessa && !q) return false;
    if(UB && m.Ubicazione!==UB) return false;
    return !q || (m.ID+" "+m.Tipo+" "+m.Marca+" "+m.Modello+" "+m.Matricola).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){ return (ORD[a.stato]-ORD[b.stato]) || String(a.prossimo).localeCompare(String(b.prossimo)) || a.ID.localeCompare(b.ID); });
  $("#lista").innerHTML=l.length?l.map(function(m){
    var fo=FOTO[m.ID]; return '<button class="mac '+cls(m.stato)+'" data-id="'+esc(m.ID)+'">'+(fo?'<img class="mini" src="'+esc(fo.m||fo.f)+'" alt="" loading="lazy">':'')+'<span class="id">'+esc(m.ID)+'</span><span class="t"><b>'+esc(m.Tipo)+'</b><small>'+esc([m.Marca,m.Modello].filter(Boolean).join(" "))+' · '+esc(m.Ubicazione)+'</small></span><span class="dx"><span class="pill '+cls(m.stato)+'">'+esc(m.stato)+'</span><small>'+(m.Dismessa?"":"prossimo "+dIt(m.prossimo))+'</small></span></button>';
  }).join(""):'<div class="vuoto">'+(MAC.some(inSez)?'Nessun elemento con questi filtri.':(SEZ==="catene"?'Nessuna catena registrata: l’elenco è in preparazione.':'Nessun mezzo registrato.'))+'</div>';
  $("#lista").querySelectorAll(".mac").forEach(function(b){b.onclick=function(){location.hash=b.dataset.id}});
}

/* scheda */
function apri(id){
  ULTIMA=null;
  var m=MAC.filter(function(x){return x.ID===id})[0]; if(!m){ location.hash=""; return; }
  ATT=m; var voci=vociDi(m); ESITI=voci.map(function(){return ""});
  var fo=FOTO[m.ID];
  $("#s-dati").innerHTML=(fo?'<a href="'+esc(fo.f)+'" target="_blank" rel="noopener"><img class="foto" src="'+esc(fo.f)+'" alt="Foto '+esc(m.ID)+'"></a>':'')+'<h2>'+esc(m.ID)+' · '+esc(m.Tipo)+'</h2><p style="margin:0 0 10px"><span class="pill '+cls(m.stato)+'">'+esc(m.stato)+'</span></p>'+
    '<div class="dati"><span>Marca / modello</span><b>'+esc([m.Marca,m.Modello].filter(Boolean).join(" ")||"—")+'</b><span>Matricola</span><b>'+esc(m.Matricola||"—")+'</b><span>Ubicazione</span><b>'+esc(m.Ubicazione)+'</b>'+(m.Condizioni&&String(m.Condizioni).length>2?'<span>Note</span><b>'+esc(m.Condizioni)+'</b>':'')+'<span>Ultimo controllo</span><b>'+(m.ultimo?dIt(m.ultimo)+" ("+esc(m.esitoUltimo)+")":"—")+'</b><span>Prossimo</span><b>'+dIt(m.prossimo)+'</b></div>'+((BASE.documenti||{})[m.ID]?'<div class="docs">'+BASE.documenti[m.ID].map(function(x){return '<a href="'+esc(x[0])+'" target="_blank" rel="noopener">📄 '+esc(x[1])+'</a>'}).join("")+'</div>':'')+(fo&&(fo.t||fo.x)?'<div class="altre">'+(fo.t?'<a class="targa" href="'+esc(fo.t)+'" target="_blank" rel="noopener"><img src="'+esc(fo.t)+'" alt="">Targhetta</a>':'')+(fo.x||[]).map(function(x){return '<a class="targa" href="'+esc(x[0])+'" target="_blank" rel="noopener"><img src="'+esc(x[0])+'" alt="">'+esc(x[1])+'</a>'}).join("")+'</div>':'');
  $("#s-voci").innerHTML=voci.length?voci.map(function(v,i){return '<label class="voce chk"><span class="n">'+(i+1)+'</span><span class="txt">'+esc(v)+'</span><input type="checkbox" data-i="'+i+'" aria-label="Controllo '+(i+1)+' superato"></label>'}).join(""):'<div class="vuoto">Nessun elenco di controlli per la categoria '+esc(m.Categoria)+'.</div>';

  $("#s-nota").value=""; try{$("#s-op").value=localStorage.getItem("operatore")||""}catch(e){}
  var k=chiaveDi(m), mo=$("#s-modello");
  if(UFF.indexOf(k)>=0){ mo.style.color="var(--ok)"; mo.textContent="Scheda MOD.SMA – "+k.charAt(0)+k.slice(1).toLowerCase()+" ("+voci.length+" controlli)"; }
  else { mo.style.color="#8a6100"; mo.textContent="Elenco provvisorio: la scheda MOD.SMA di questo tipo di macchina non è ancora stata caricata."; }
  var conPin=!!(API&&OP); $("#s-op-campo").hidden=conPin; $("#s-firma").hidden=!conPin; if(conPin) $("#s-firma-nome").textContent=OP.nome;
  var es=$("#s-esito"); es.className="esito"; es.textContent="";
  $("#s-salva").disabled=m.Dismessa||!voci.length;
  $("#s-storico").innerHTML='<div class="vuoto">'+(API?"Caricamento…":"Lo storico sarà disponibile dopo il collegamento al foglio Google.")+'</div>';
  $("#v-elenco").classList.remove("on"); $("#v-scheda").classList.add("on"); $("#indietro").classList.add("on"); window.scrollTo(0,0);
  if(API) fetch(API+"?a=storico&id="+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(d){
    if(ATT!==m) return;
    $("#s-storico").innerHTML=(d.controlli||[]).length?d.controlli.map(function(c){ var ko=(c.esiti||[]).map(function(x,i){return x==="NON OK"?(i+1):null}).filter(Boolean);
      return '<div><b>'+dIt(c.data)+(c.ora?" "+esc(c.ora):"")+'</b> · <span class="pill '+(c.esito==="OK"?"IN_REGOLA":"FUORI_USO")+'">'+esc(c.esito)+'</span> · '+esc(c.operatore)+(ko.length?'<br><small>NON OK: punti '+ko.join(", ")+'</small>':'')+(c.nota?'<br><small>'+esc(c.nota)+'</small>':'')+'</div>'; }).join(""):'<div class="vuoto">Nessun controllo registrato.</div>';
  }).catch(function(){ $("#s-storico").innerHTML='<div class="vuoto">Storico non disponibile (senza campo?).</div>'; });
}
var ULTIMA=null;
function leggiCaselle(){ ESITI=Array.from(document.querySelectorAll("#s-voci input[type=checkbox]")).map(function(c){return c.checked?"OK":"NON OK"}); return ESITI; }
function esito(t,tipo){ var e=$("#s-esito"); e.className="esito on "+tipo; e.textContent=t; }
function salva(){
  var m=ATT, voci=vociDi(m);
  leggiCaselle();
  var op=(API&&OP)?OP.nome:$("#s-op").value.trim(); if(!op) return esito("Scrivi il nome dell'operatore.","ko");
  var nonOk=ESITI.map(function(x,i){return x==="NON OK"?i+1:null}).filter(Boolean);
  if(nonOk.length && !confirm((nonOk.length===1?"Il controllo "+nonOk[0]+" non è spuntato":"I controlli "+nonOk.join(", ")+" non sono spuntati")+": la macchina risulterà FUORI USO.\n\nConfermi?")) return;
  if(!(API&&OP)) try{localStorage.setItem("operatore",op)}catch(e){}
  if(!API) return esito("Gestionale non ancora collegato al foglio Google: il controllo non è stato salvato. Puoi comunque stampare la scheda.","info");
  var b=$("#s-salva"); b.disabled=true; esito("Registrazione in corso…","info");
  fetch(API,{method:"POST",body:JSON.stringify({chiave:CHIAVE,azione:"registra",pin:OP&&OP.pin,id:m.ID,esiti:ESITI,nota:$("#s-nota").value})})
    .then(function(r){return r.json()}).then(function(d){
      b.disabled=false;
      if(!d.ok){ if(d.errore==="pin"){ esci(); return esito("Il tuo PIN non è più valido: rientra.","ko"); } return esito("Non salvato: "+(d.errore||"errore"),"ko"); }
      ULTIMA={nome:d.operatore||op,quando:d.quando||""};
      esito(d.esito==="OK"?"Registrato: esito OK. Prossimo controllo "+dIt(d.prossimo)+".":"Registrato: esito FUORI USO. Segnala la macchina con il cartello e avvisa il preposto.", d.esito==="OK"?"ok":"ko");
      if(d.esito==="OK") setTimeout(function(){ location.hash=""; },2500);
      carica();
    }).catch(function(){ b.disabled=false; esito("Nessuna connessione: il controllo non è stato salvato, riprova quando c'è campo.","ko"); });
}
function stampa(){
  leggiCaselle();
  var m=ATT, voci=vociDi(m), oggi=new Date(), k=chiaveDi(m);
  var dd=String(oggi.getDate()).padStart(2,"0")+"/"+String(oggi.getMonth()+1).padStart(2,"0")+"/"+oggi.getFullYear();
  var tutti=ESITI.length&&ESITI.every(function(x){return x}), esitoTot=ESITI.indexOf("NON OK")>=0?"FUORI USO":(tutti?"OK":"");
  $("#stampa").innerHTML=
   '<table><tr><td style="width:14%"><b>MOD.SMA</b></td><td style="width:20%">Rev. 0</td><td style="width:26%">Data '+dd+'</td><td>Pagina 1 di 1</td></tr></table>'+
   '<table><tr><td style="width:30%"><b>Delfapi S.r.l.</b></td><td><b>SCHEDA DI MANUTENZIONE</b> Trimestrale – Anno '+oggi.getFullYear()+'</td></tr></table>'+
   '<table><tr><th>Descrizione</th><th>Marca</th><th>Tipo</th><th>Codice di identificazione</th><th>Sigla</th></tr><tr><td>'+esc(m.Tipo)+'</td><td>'+esc(m.Marca)+'</td><td>'+esc(m.Modello)+'</td><td>'+esc(m.Matricola)+'</td><td>'+esc(m.ID)+'</td></tr></table>'+
   '<table><tr><th style="width:7%">POS</th><th>OPERAZIONE / INTERVENTO</th><th style="width:9%">OK</th><th style="width:11%">NON OK</th></tr>'+voci.map(function(v,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(v)+'</td><td style="text-align:center">'+(ESITI[i]==="OK"?"X":"")+'</td><td style="text-align:center">'+(ESITI[i]==="NON OK"?"X":"")+'</td></tr>'}).join("")+'</table>'+
   '<table><tr><th style="width:18%">Note</th><td colspan="3" style="height:46px">'+esc($("#s-nota").value)+'</td></tr>'+
   '<tr><th>Esito</th><td>'+esitoTot+'</td><th style="width:20%">Prossimo controllo</th><td>'+(tutti?dIt(piuMesi(oggi,3).toISOString().slice(0,10)):"")+'</td></tr>'+
   '<tr><th>Data</th><td>'+dd+'</td><th>Firma</th><td style="height:40px">'+esc((API&&OP)?OP.nome:$("#s-op").value)+(ULTIMA?'<br><small>Registrato con PIN personale'+(ULTIMA.quando?' il '+esc(ULTIMA.quando):'')+'</small>':'')+'</td></tr></table>'+
   '<p style="margin-top:8px"><b>Intervento straordinario</b> (descrizione, data, firma):</p><table>'+[1,2,3].map(function(){return '<tr><td style="height:26px"></td><td style="width:18%"></td><td style="width:22%"></td></tr>'}).join("")+'</table>'+
   (UFF.indexOf(k)<0?'<p><i>Elenco controlli provvisorio, non ancora sostituito dalla scheda MOD.SMA di questo tipo di macchina.</i></p>':'')+
   '<p>Un controllo NON OK = macchina FUORI USO: cartello e avviso al preposto.</p>';
  window.print();
}

/* caricamento */
function carica(){
  if(!API){ daBase(); $("#modo").hidden=false; $("#modo").textContent="Anteprima con i dati del MOD.EIM del 04/11/2026: il collegamento al foglio Google è da completare, i controlli non vengono ancora salvati."; route(); return; }
  fetch(API+"?a=elenco").then(function(r){return r.json()}).then(function(d){
    MAC=d.macchine||[]; if(d.tipi&&Object.keys(d.tipi).length) TIPI=d.tipi; AGG=d.aggiornato||"";
    $("#modo").hidden=!AGG; $("#modo").textContent="Dati aggiornati al "+AGG+".";
    if(ATT && $("#v-scheda").classList.contains("on")){ ATT=MAC.filter(function(x){return x.ID===ATT.ID})[0]||ATT; disegna(); return; }
    route();
  }).catch(function(){ daBase(); $("#modo").hidden=false; $("#modo").textContent="Senza connessione: vedi i dati del MOD.EIM, non quelli aggiornati."; route(); });
}
function route(){ var id=decodeURIComponent((location.hash||"").replace(/^#/,"")); if(id) apri(id); else { $("#v-scheda").classList.remove("on"); $("#v-elenco").classList.add("on"); $("#indietro").classList.remove("on"); ATT=null; disegna(); } }

/* PIN (lo stesso del sito) */
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function pinOk(){ try{return localStorage.getItem("pin-ctrl")===PIN_H}catch(e){return false} }
function chiediPin(){
  var d=document.createElement("div"); d.className="pin";
  d.innerHTML='<div class="pin-box"><img src="marchio.png" alt="" style="width:90px;height:90px;border-radius:50%;background:#fff;padding:14px 12px 10px"><h1>Controlli attrezzature</h1><p>Area riservata: inserisci il PIN dei controlli.</p><input id="pin-in" type="password" inputmode="numeric" maxlength="8" aria-label="PIN"><button id="pin-ok">Entra</button><div class="err" id="pin-err"></div></div>';
  document.body.appendChild(d); var i=d.querySelector("#pin-in"); setTimeout(function(){i.focus()},100);
  function prova(){ sha(i.value.trim()).then(function(x){ if(x===PIN_H){ try{localStorage.setItem("pin-ctrl",x)}catch(e){} d.remove(); } else { d.querySelector("#pin-err").textContent="PIN non corretto."; i.value=""; } }); }
  d.querySelector("#pin-ok").onclick=prova; i.onkeydown=function(e){ if(e.key==="Enter") prova(); };
}

function mostraOp(){ var e=$("#esci"); e.hidden=!(API&&OP); if(API&&OP){ $("#sotto").textContent="Operatore: "+OP.nome; } }
function esci(){ OP=null; try{localStorage.removeItem("op-ctrl")}catch(e){} mostraOp(); accesso(); }
function accesso(){
  var d=document.createElement("div"); d.className="pin";
  d.innerHTML='<div class="pin-box"><img src="marchio.png" alt="" style="width:90px;height:90px;border-radius:50%;background:#fff;padding:14px 12px 10px"><h1>Controlli attrezzature</h1><p>Entra con il tuo <b>PIN personale</b>: i controlli verranno registrati a tuo nome.</p><input id="op-in" type="password" inputmode="numeric" maxlength="8" aria-label="PIN personale"><button id="op-ok">Entra</button><div class="err" id="op-err"></div><a href="./" style="color:#fff;display:inline-block;margin-top:16px">‹ Torna a Procedure e sicurezza</a></div>';
  document.body.appendChild(d); var i=d.querySelector("#op-in"), b=d.querySelector("#op-ok"); setTimeout(function(){i.focus()},100);
  function prova(){ var pin=i.value.trim(); if(!pin) return; b.disabled=true; d.querySelector("#op-err").textContent="Verifica…";
    fetch(API,{method:"POST",body:JSON.stringify({chiave:CHIAVE,azione:"login",pin:pin})}).then(function(r){return r.json()}).then(function(r){
      b.disabled=false;
      if(r.ok){ OP={nome:r.nome,pin:pin}; try{localStorage.setItem("op-ctrl",JSON.stringify(OP))}catch(e){} d.remove(); mostraOp(); route(); }
      else { d.querySelector("#op-err").textContent=r.errore==="pin"?"PIN non riconosciuto.":r.errore; i.value=""; }
    }).catch(function(){ b.disabled=false; d.querySelector("#op-err").textContent="Serve la connessione per entrare."; });
  }
  b.onclick=prova; i.onkeydown=function(e){ if(e.key==="Enter") prova(); };
}
$("#esci").onclick=esci;
$("#cerca").addEventListener("input",disegna);
$("#indietro").onclick=function(){ location.hash=""; };
$("#s-salva").onclick=salva; $("#s-stampa").onclick=stampa; $("#s-annulla").onclick=function(){ location.hash=""; };
window.addEventListener("hashchange",route);
if(API){ if(!OP) accesso(); mostraOp(); } else if(!pinOk()) chiediPin();
carica();
})();
</script>
